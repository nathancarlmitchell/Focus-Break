<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
    <style>
        html, body { margin: 0; padding: 0; } /* canvas fills the window so page and canvas coordinates match */
        html { overflow: hidden; } /* no scrollbars; not on body, which would clip the turned canvas to its untransformed box */
        canvas { display: block; }
        /* touch play: no scrolling, pull-to-refresh, zooming, text selection, long-press menu or tap highlight */
        html, body, canvas { touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none;
            -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body onload="onLoad()" onresize="windowResize()" oncontextmenu="return false;">
    <audio id="audio01" src="music/Cavalier - Vol. 8 - 01 Before U Go.mp3"></audio>
    <audio id="audio02" src="music/Cavalier - Vol. 8 - 02 Reflex.mp3"></audio>
    <audio id="audio03" src="music/Cavalier - Vol. 8 - 03 Blood (feat. Fifty Grand).mp3"></audio>
    <audio id="audio04" src="music/Cavalier - Vol. 8 - 04 Undefined.mp3"></audio>
    <audio id="audio05" src="music/Cavalier - Vol. 8 - 05 Lay.mp3"></audio>
    <audio id="audio06" src="music/Cavalier - Vol. 8 - 06 Kitty Kat.mp3"></audio>
    <audio id="audio07" src="music/Cavalier - Vol. 8 - 07 Too Late.mp3"></audio>
    <audio id="audio08" src="music/Cavalier - Vol. 8 - 08 Midnight (Cavalier Version).mp3"></audio>
    <audio id="audio09" src="music/Cavalier - Vol. 8 - 09 Commas.mp3"></audio>
    <audio id="audio10" src="music/Cavalier - Vol. 8 - 10 Gone.mp3"></audio>
    <audio id="audio11" src="music/Cavalier - Vol. 8 - 11 Love U.mp3"></audio>
    <audio id="bombSFX" src="music/BOMB_SIREN-BOMB_SIREN-247265934.wav"></audio>
    <audio id="fx11" src="music/Fx 11.wav"></audio>
    <audio id="fx14" src="music/Fx 14.wav"></audio>
    <audio id="danger" src="music/72.wav"></audio>
    <audio id="menusound2" src="music/Menu Sounds_2.wav"></audio>
    <audio id="fx_powerUp" src="music/powerUp.wav"></audio>
    <audio id="fx_pickupCoin" src="music/pickupCoin.wav"></audio>
    <audio id="fx_click" src="music/click.wav"></audio>
<script>

// initialize audio
const all_songs = ["01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11"].map(function (n) {
    return document.getElementById("audio" + n);
});

function sfx(id, volume) { // look up a sound effect, optionally setting its volume
    var sound = document.getElementById(id);
    if (volume !== undefined) {
        sound.volume = volume;
    }
    return sound;
}
const aud_bomb = sfx("bombSFX", 0.3);
const aud_menuSound = sfx("menusound2", 0.2);
const aud_death = sfx("fx14", 0.15);
const aud_danger = sfx("danger", 0.05);
const aud_powerUp = sfx("fx_powerUp", 0.1);
const aud_pickupCoin = sfx("fx_pickupCoin", 0.1);
const aud_click = sfx("fx_click", 0.1);
const aud_startup = sfx("fx11");
var musicVolume = 0.2;


// Screens (start, level transitions, finish, pause) are laid out for a LAYOUT_W x LAYOUT_H window and scaled to fit
// the actual window, centered, so they never run off screen. Gameplay stays in window pixels.
var LAYOUT_W = 1280;
var LAYOUT_H = 800;

// start-screen buttons, relative to the center of the layout; used for drawing, hover and clicks
// `touch` is the bigger layout used for touch play (labels centered in the boxes)
const START_BUTTONS = {
    start: { dx: -410, dy: -32, w: 220, h: 44, hitH: 46, // clickable area is 2px taller than the drawn box
        touch: { dx: -450, dy: -60, w: 400, h: 150 } },
    break: { dx: 0, dy: 0, w: 272, h: 40, label: "Space to Break", ty: 38,
        help: "SPACEBAR or MIDDLE MOUSE BUTTON = BREAK - Become invincible briefly.  Lose score, emergency use only!",
        touch: { dx: 60, dy: -150, w: 420, h: 110 }, touchLabel: "Tap to Break",
        touchHelp: "BREAK button (tap) = Become invincible briefly.  Lose 250 score, emergency use only!  Drag anywhere to steer." },
    focus: { dx: 0, dy: 60, w: 272, h: 40, label: "Shift to Focus", ty: 100,
        help: "SHIFT or LEFT MOUSE BUTTON = FOCUS - Slows time and decrease hitbox size.  Earn no score, use in a tight spot.",
        touch: { dx: 60, dy: -20, w: 420, h: 110 }, touchLabel: "Hold to Focus",
        touchHelp: "FOCUS button (hold) = Slows time and shrinks your hitbox.  Earn no score, use in a tight spot.  Drag anywhere to steer." },
    warp: { dx: 0, dy: 120, w: 272, h: 40, label: "Click to warp", ty: 160,
        help: "CTRL or RIGHT MOUSE BUTTON: WARP - Speeds up time.  Earn double score, you madman.",
        touch: { dx: 60, dy: 110, w: 420, h: 110 }, touchLabel: "Hold to Warp",
        touchHelp: "WARP button (hold) = Speeds up time.  Earn double score, you madman.  Drag anywhere to steer." },
};
var hoveredButton = ""; // start-screen button under the mouse (or finger)

function startLayout() { // "classic" (the original mouse layout) or "touch" (bigger, centered buttons)
    return inputMode == "touch" ? "touch" : "classic";
}

function geom(name) { // a start-screen button's rectangle in the current layout
    var b = START_BUTTONS[name];
    var style = startLayout();
    return style == "classic" ? b : b[style];
}

// start screen animation, stopped when the game starts (same-delay timers run in creation order)
const startScreenIntervals = [
    setInterval(updateSloganText, 3000),
    setInterval(focus_break_colors, 100),
    setInterval(click_to_start_colors, 50),
    setInterval(highlightControl, 100),
];

// obstacles by lane (the lane sets how fast they move) and powerups; clearObjects replaces the lists
const OBSTACLE_SPEEDS = { slow: 1, medium: 2, fast: 4, hyper: 5 }; // pixels per frame at normal speed
var obstacles, powerups;
function clearObjects() {
    obstacles = { slow: [], medium: [], fast: [], hyper: [] };
    powerups = { break: [], score: [] };
}
clearObjects();
function obstacleLists() { // every obstacle list, slowest lane first
    return [obstacles.slow, obstacles.medium, obstacles.fast, obstacles.hyper];
}

// game play variables
var x = window.innerWidth;
var y = window.innerHeight;
var startTime; // when the run started (ms); moved forward by time spent paused
var pauseStart;
var pausedSong = null; // song to resume when unpausing
var restFrame = null; // uncropped copy of the between-levels screen, for redrawing after resizes
var gamePiece;
var gamePieceColor = "blue";
var sloganText = "";
var sloganY = 120;
var sloganX = 100;

var invincible = false;
var gameStart = false;
var alive = false;
var focused = false;
var pause = false;

var score = 0;
var scoreLimit = 1000;
var powerupScoreBonus = 50;
var scorePenalty = 250; // point deduction for break
var deaths = 0;
var invincibleTime = 0;
var invincibleTimeMax = 200;
var perfectClear = 0;
var scoreLimitReached = false; // level cleared, even if score later drops below the limit
var runFinished = false; // level 15 cleared; the finish screen is showing
var restartArmed = false; // a click began on the finish screen
var finishTime = 0; // when the finish screen appeared
var level = 1;
var speed = 1;
var speed_slow = 0.25;
var speed_fast = 2;


function loadAudio() { // on the first click: start the album, each track playing the next, looping back to the first
    setMusicVolume(musicVolume);
    all_songs.forEach(function (song, i) {
        song.onended = function () { playSound(all_songs[(i + 1) % all_songs.length]); };
    });
    playSound(all_songs[0]);
}

function playSound(audio) { // play, ignoring failures such as blocked autoplay or a missing file
    var playing = audio.play();
    if (playing) { // older browsers (Chrome < 50, Firefox < 53) return nothing
        playing.catch(function () {});
    }
}

function setMusicRate(rate) { // playback rate for all songs
    all_songs.forEach(function (song) { song.playbackRate = rate; });
}

function setMusicVolume(volume) { // volume for all songs
    all_songs.forEach(function (song) { song.volume = volume; });
}

function layoutFrame() { // scale and offset that fit the LAYOUT_W x LAYOUT_H layout into the window, centered
    var scale = Math.min(gameArea.canvas.width / LAYOUT_W, gameArea.canvas.height / LAYOUT_H);
    return { scale: scale, x: (gameArea.canvas.width - LAYOUT_W * scale) / 2, y: (gameArea.canvas.height - LAYOUT_H * scale) / 2 };
}

function useLayout() { // draw in layout coordinates until useWindow()
    var f = layoutFrame();
    ctx.setTransform(f.scale, 0, 0, f.scale, f.x, f.y);
}

function useWindow() { // draw in window pixels (gameplay, banners)
    ctx.setTransform(1, 0, 0, 1, 0, 0);
}

function hudScale() { // the in-game HUD keeps its size unless the window is too short or narrow for it
    // between the top banner (ends at 70px) and the level name (baseline 60px from the bottom) it needs 240px of
    // stats plus 30px of level name, and 600px across for the FOCUS/BREAK/DANGER text
    return Math.max(0.1, Math.min(1, (gameArea.canvas.height - 130) / 270, gameArea.canvas.width / 600));
}

function useHud() { // draw the top-left HUD, shrunk toward the top banner if needed
    var s = hudScale();
    ctx.setTransform(s, 0, 0, s, 0, 70 * (1 - s));
}

function buttonAt(px, py) { // name of the start-screen button at a window point, or ""
    var f = layoutFrame();
    if (!(f.scale > 0)) {
        return "";
    }
    var lx = (px - f.x) / f.scale; // the point in layout coordinates
    var ly = (py - f.y) / f.scale;
    for (var name in START_BUTTONS) {
        var b = geom(name);
        var left = LAYOUT_W / 2 + b.dx;
        var top = LAYOUT_H / 2 + b.dy;
        if (lx > left && lx < left + b.w && ly > top && ly < top + (b.hitH || b.h)) {
            return name;
        }
    }
    return "";
}

function mouseMove(event) { // highlight the start-screen button under the mouse
    if (!gameStart) {
        var p = toGame(event.clientX, event.clientY);
        setHovered(buttonAt(p.x, p.y));
    }
}

function setHovered(name) { // highlight one start-screen button (or none)
    if (name != hoveredButton) { // only one button highlighted at a time
        drawStartScreen(); // erase the old highlight
        hoveredButton = name;
    }
}

function drawStartButtonText(b) { // the START button's label, in the current fill style
    var cx = LAYOUT_W / 2;
    var cy = LAYOUT_H / 2;
    if (startLayout() == "classic") {
        ctx.font = "25px Arial";
        ctx.fillText("CLICK TO START", cx - 400, cy);
        return;
    }
    ctx.save();
    ctx.textAlign = "center";
    ctx.font = "44px Arial";
    ctx.fillText("TAP TO START", cx + b.dx + b.w / 2, cy + b.dy + b.h * 0.45);
    ctx.font = "28px Arial";
    ctx.fillText("タップして開始", cx + b.dx + b.w / 2, cy + b.dy + b.h * 0.8);
    ctx.restore();
}

function drawControlLabel(name) { // a control button's label, in the current fill style
    var b = START_BUTTONS[name];
    var cx = LAYOUT_W / 2;
    var cy = LAYOUT_H / 2;
    if (startLayout() == "classic") {
        ctx.font = "40px Impact";
        ctx.fillText(b.label, cx + b.dx, cy + b.ty);
        return;
    }
    var g = geom(name);
    ctx.save();
    ctx.textAlign = "center";
    ctx.font = "48px Impact";
    ctx.fillText(b.touchLabel, cx + g.dx + g.w / 2, cy + g.dy + g.h / 2 + 17);
    ctx.restore();
}

function drawTitle(shadowColor, passes) { // FOCUS BREAK title: stacked shadow copies, then magenta on top
    ctx.font = "80px Arial";
    ctx.fillStyle = shadowColor;
    for (let count = 130 - passes; count < 130; count++){ // Bold effect
        ctx.fillText("FOCUS BREAK", count, count+80);
        ctx.fillText("焦点を絞る", count+100, count+180);
    }
    ctx.fillStyle = "#ff00ff";
    ctx.fillText("FOCUS BREAK", 130, 210);
    ctx.fillText("焦点を絞る", 230, 310);
}

function focus_break_colors(){ // Flashing colors on start screen
    useLayout();
    drawTitle(getRandomColor(), 3);
    useWindow();
}

function click_to_start_colors(){ // Flashing colors on start screen
    if (hoveredButton == "start" || (inputMode == "touch" && !hoveredButton)) { // in touch play START always flashes
        var b = geom("start");
        ctx.globalAlpha = 0.35;
        ctx.fillStyle = getRandomColorGold();
        var i_x = getRandomInteger(-1, 1);
        var i_y = getRandomInteger(-1, 1);
        useLayout();
        ctx.fillRect(LAYOUT_W / 2 + b.dx + i_x, LAYOUT_H / 2 + b.dy + i_y, b.w + i_x, b.h + i_y);
        ctx.globalAlpha = 1.0;
        ctx.fillStyle = "black";
        drawStartButtonText(b);
        useWindow();
    }
}

function highlightControl() { // Flashing colors on the hovered control button (start screen)
    var b = START_BUTTONS[hoveredButton];
    if (!b || !b.help) {
        return;
    }
    var g = geom(hoveredButton);
    useLayout();
    ctx.fillStyle = "#000000";
    ctx.fillRect(LAYOUT_W / 2 + g.dx, LAYOUT_H / 2 + g.dy, g.w, g.h);
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = getRandomColor();
    drawControlLabel(hoveredButton);
    ctx.globalAlpha = 1.0;
    useWindow();
}

function onLoad() {
    gameArea.load();
    updateSloganText();
    playSound(aud_startup); // startup sound; browsers usually block it until the first click
}

const SLOGANS = ["TOO HARD", "Now in Color!", "Vegan!", "Siezure inducing!", "Advanced!", "Fresh!", "Spicy!", "Gotta Go Fast!",
    "Classic", "Coming Soon!", "4K 1080p", "Lite", "今は日本語です！", "Version 2", "Bug Free!", "Not Lame!", "...", "ULTRA", ""];

function updateSloganText() { // pick a random slogan and redraw the start screen
    sloganText = SLOGANS[Math.floor(Math.random() * SLOGANS.length)];
    drawStartScreen();
}

function copyCanvas() { // copy of what's on screen, or null if the canvas has no size
    if (gameArea.canvas.width == 0 || gameArea.canvas.height == 0) {
        return null;
    }
    var copy = document.createElement("canvas");
    copy.width = gameArea.canvas.width;
    copy.height = gameArea.canvas.height;
    copy.getContext("2d").drawImage(gameArea.canvas, 0, 0);
    return copy;
}

function windowResize() {
    var wasTall = gameArea.tall;
    var wasRotated = rotated;
    var moved = false; // the square had to be moved back on screen
    // resizing clears the canvas; keep what's shown between levels, e.g. a level transition message.
    // copy it once, before the first resize crops it, and reuse that copy for later resizes
    if (gameStart && !alive && !restFrame) {
        restFrame = copyCanvas();
    }
    gameArea.load();
    if (alive) {
        if (inputMode == "touch") {
            if (wasTall != gameArea.tall || wasRotated != rotated) {
                setPause(true); // the device was turned: give the player a moment
            }
            // keep the square on the new screen (otherwise it would sweep back through obstacles it can't see) and steer from there
            var cx = gamePiece.x + gamePiece.width / 2;
            if (cx > gameArea.canvas.width) { // off the right edge: put it a little inside, not in the column where obstacles come in
                cx = gameArea.canvas.width - gamePiece.width / 2 - 40;
            }
            cx = Math.max(0, cx);
            var cy = Math.max(0, Math.min(gamePiece.y + gamePiece.height / 2, gameArea.canvas.height));
            moved = cx != gamePiece.x + gamePiece.width / 2 || cy != gamePiece.y + gamePiece.height / 2;
            gamePiece.x = cx - gamePiece.width / 2;
            gamePiece.y = cy - gamePiece.height / 2;
            gameArea.x = cx;
            gameArea.y = cy;
        }
        fitObstaclesToWindow();
        if (moved) { // clear anything the square was moved onto: it couldn't be dodged (steering waits for the resume)
            obstacleLists().forEach(function (objects) {
                for (var i = objects.length - 1; i >= 0; i--) {
                    if (gamePiece.crashWith(objects[i])) {
                        objects.splice(i, 1);
                    }
                }
            });
        }
        if (pause) { // nothing redraws while paused, so draw the refitted level and the panel once
            stopResume(); // a resize stops a touch resume countdown: the panel asks for a tap again
            drawLevel();
            drawPauseScreen();
        }
    } else if (restFrame) {
        gameArea.context.drawImage(restFrame, 0, 0);
    }
    if (!gameStart) {
        drawStartScreen();
    }
}

function drawStartScreen() { // draw the start screen
    var cx = LAYOUT_W / 2;
    var cy = LAYOUT_H / 2;

    // clear screen
    useWindow();
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, x, y);

    // Title
    useLayout();
    drawTitle("#00FFFF", 10);

    if (startLayout() == "classic") {
        // start button
        ctx.font = "25px Arial";
        ctx.globalAlpha = 0.2;
        ctx.fillStyle = "gray";
        var start = START_BUTTONS.start;
        ctx.fillRect(cx + start.dx, cy + start.dy, start.w, start.h);
        ctx.globalAlpha = 1.0;
        ctx.fillStyle = "black";
        ctx.fillText("CLICK TO START", cx - 400, cy);
        ctx.fillRect(cx - 450, cy + 25, 300, 2);
        ctx.fillText("クリックして開始", cx - 400, cy + 65);

        // controls: all boxes, then all labels
        var controls = [START_BUTTONS.break, START_BUTTONS.focus, START_BUTTONS.warp];
        ctx.fillStyle = "#00FFFF";
        controls.forEach(function (b) { ctx.fillRect(cx + b.dx, cy + b.dy, b.w, b.h); });
        ctx.font = "40px Impact";
        ctx.fillStyle = "#ff00ff";
        ctx.globalAlpha = 0.5;
        controls.forEach(function (b) { ctx.fillText(b.label, cx + b.dx, cy + b.ty); });
    } else {
        drawBigStartButtons();
    }

    // horizontal banners across the whole window
    useWindow();
    ctx.globalAlpha = 1.0;
    ctx.font = "40px Arial";
    ctx.fillStyle = "#00FFFF";
    var k = bannerScale();
    drawBanners(34, 30, k);
    ctx.fillStyle = "#ff00ff";
    drawBanners(40, 20, k);
    ctx.fillStyle = "black";
    ctx.globalAlpha = 0.7;
    ctx.fillRect(0, y - 40 * k, x, 2);
    ctx.fillRect(0, 60 * k, x, 2);

    // slogan
    useLayout();
    ctx.globalAlpha = 1.0;
    ctx.fillStyle = "#ff00ff";
    ctx.fillText(sloganText,sloganX,sloganY);
    if (sloganText == "Bug Free!"){
        for (let count = 1; count < 40; count++){ // Bold effect
            ctx.fillText("Bug Free!",sloganX-40+count,sloganY-40+count);
            ctx.fillStyle = getRandomColor();
        }
    }

    // Options (not shown in the bigger touch layout)
    if (startLayout() == "classic") {
        var boxX = 256;
        var boxY = 40;
        var Yoffset = boxX/2;
        ctx.fillRect(cx, (LAYOUT_H - Yoffset), boxX, boxY);
        ctx.fillText("Options", cx, (LAYOUT_H - Yoffset));

        ctx.fillStyle = "black";
        ctx.fillRect((cx + (boxX / 16)), (LAYOUT_H - Yoffset + (boxY / 4)), boxX/3, boxY/2);
        ctx.fillRect((cx + (boxX / 16)*8), (LAYOUT_H - Yoffset + (boxY / 4)), boxX/3, boxY/2);

        ctx.fillStyle = "pink";
        ctx.fillText("Options", (cx + (boxX / 16)), (LAYOUT_H - Yoffset + (boxY / 4))+10);
    }
    useWindow();
}

function drawBigStartButtons() { // the start screen's START and control buttons in the bigger touch layout
    var cx = LAYOUT_W / 2;
    var cy = LAYOUT_H / 2;
    var start = geom("start");
    ctx.globalAlpha = 0.2;
    ctx.fillStyle = "gray";
    ctx.fillRect(cx + start.dx, cy + start.dy, start.w, start.h);
    ctx.globalAlpha = 1.0;
    ctx.fillStyle = "black";
    drawStartButtonText(start);
    var names = ["break", "focus", "warp"];
    ctx.fillStyle = "#00FFFF";
    names.forEach(function (name) { var g = geom(name); ctx.fillRect(cx + g.dx, cy + g.dy, g.w, g.h); });
    ctx.fillStyle = "#ff00ff";
    ctx.globalAlpha = 0.5;
    names.forEach(drawControlLabel);
    ctx.globalAlpha = 1.0;
    ctx.fillStyle = "black";
    ctx.font = "28px Arial";
    ctx.fillText("Drag anywhere to steer", 190, 540);
}

function startGame(e) {
    if (!gameStart) { // first start
        startScreenIntervals.forEach(function (id) { clearInterval(id); });
        loadAudio();
        playSound(aud_click);
        startTime = Date.now();
        var size = pieceSize();
        gamePiece = new component(size, size, gamePieceColor, e.pageX - size / 2, e.pageY - size / 2); // centered on the cursor
    }
    gameArea.start();
    gameStart = true;
    alive = true;
    restFrame = null; // the next transition screen gets a fresh copy
    pause = false;
    var cx = gamePiece.x + gamePiece.width / 2;
    var cy = gamePiece.y + gamePiece.height / 2;
    if (inputMode == "touch" && (cx < 0 || cy < 0 || cx > gameArea.canvas.width || cy > gameArea.canvas.height)) {
        // the window shrank between levels: back to the touch start spot (the level starts empty)
        gameArea.x = gameArea.canvas.width * 0.25;
        gameArea.y = gameArea.canvas.height * 0.5;
        gamePiece.x = gameArea.x - gamePiece.width / 2;
        gamePiece.y = gameArea.y - gamePiece.height / 2;
    }
    if (!document.hasFocus()) { // player left during the level transition; wait for them
        setPause(true);
    }
    applyHeldSpeed(); // pick up a power held through the level transition (does nothing while paused)
}

function startTouchGame() { // start from a tap: the square starts at the left middle, and sounds are unlocked in this tap
    [aud_bomb, aud_menuSound, aud_death, aud_danger, aud_powerUp, aud_pickupCoin].forEach(function (sound) {
        // mobile browsers only let a sound play later if it was first played during a tap; pausing at once keeps it silent
        // (a later reset, once play() settles, could stop the sound's first real use on a slow connection)
        var playing = sound.play();
        sound.pause();
        if (playing) {
            playing.catch(function () {}); // pausing before playback starts rejects play()
        }
    });
    var startX = gameArea.canvas.width * 0.25;
    var startY = gameArea.canvas.height * 0.5;
    startGame({ pageX: startX, pageY: startY });
    gameArea.x = startX; // the steering target starts on the square
    gameArea.y = startY;
}

function wait(time) {
    setTimeout(startNextLevel, time);
}

function restartRun() { // after the finish screen, start a fresh run from level 1
    runFinished = false;
    restartArmed = false;
    level = 1;
    deaths = 0;
    perfectClear = 0; // the hitbox shrink is earned again each run
    score = 0;
    scoreLimitReached = false;
    startTime = Date.now();
    setPieceSize(pieceSize());
    startNextLevel();
}

function startNextLevel() {
    gameArea.clear();
    startGame();
    setMusicVolume(musicVolume);
}

function centerText(text, dx, dy, passes) { // a message at an offset from the layout center; passes > 1 repeats it 1px apart for a bold look
    for (let i = 0; i < (passes || 1); i++) {
        ctx.fillText(text, LAYOUT_W / 2 + dx + i, LAYOUT_H / 2 + dy + i);
    }
}

function gameOver() { // the level was cleared or the player died
    alive = false;
    endBreak(); // a level can end mid-break
    resumeSpeed();
    setMusicVolume(musicVolume);
    gameArea.stop();
    gameArea.clear();
    clearObjects();
    fxReset(); // the screen is cleared for the message: nothing of the effects carries over
    ctx.font = "60px Arial";
    ctx.fillStyle = "red";
    useLayout(); // messages are laid out for LAYOUT_W x LAYOUT_H and scaled to the window
    gameArea.canvas.style.cursor = "default";
    var levelCleared = score >= scoreLimit || scoreLimitReached;
    scoreLimitReached = false;
    if (levelCleared) { // Next level
        level++;
        if (level == 16){ // true finish
            centerText("Time: " + millisToMinutesAndSeconds(Date.now() - startTime), -350, 0);
            if (deaths == 0){

            } else {

            }

            finishTime = Date.now();

            return;
        } else if (level == 10){ // you win
            ctx.fillStyle = "Black";

        } else if (level == 9){

        } else if (deaths == 0) { // perfect clear
            playSound(aud_menuSound);
            ctx.fillStyle = "#48D1CC";
            if (perfectClear < 7){ // decrease hitbox size
                perfectClear++;
                centerText("Hitbox size decreased!", -325, -75);

            }
            centerText("+ Perfect 完全 +", -200, -175, 3);
            drawBanners(40, 20, bannerScale());
            wait(3000);
        } else { // normal clear
            centerText("Enemies Approaching", -300, -175);
            centerText("非常に大きな敵に接近する危険!", -425, -50);
            centerText("慎重に進んでください!", -300, 25);
            wait(3000);
        }
    } else { // you lose
        deaths += 1;
        playSound(aud_death);
        centerText("Score: " + score, -200, -75);
        var deathSlogan = { 69: "😂", 420: "blaze it", 666: "😈", 911: "TOO SOON", 999: "TOO HARD" }[score]; // special scores
        if (deathSlogan) {

        } else {
            centerText("Try Again", -200, -175);
            centerText("再試行する", -200, 25);

}

function resizeAroundCenter(obj, size) { // make obj a size x size square with the same center
    obj.x -= (size - obj.width) / 2;
    obj.y -= (size - obj.height) / 2;
    obj.width = size;
    obj.height = size;
}

function setPieceSize(size) { // gamePiece's center sits on the cursor
    resizeAroundCenter(gamePiece, size);
}

function pieceSize() { // hitbox size: smaller during Focus or Warp, and 1px smaller for each flawless level
    return (focused ? 15 : 20) - perfectClear;
}

function setMode(isFocused, newSpeed, musicRate) { // normal speed, Focus or Warp
    focused = isFocused;
    if (alive) {
        setPieceSize(pieceSize());
    }
    speed = newSpeed;
    setMusicRate(musicRate);
}

function resumeSpeed() { setMode(false, 1, 1.0); }
function setSlowSpeed() { setMode(true, speed_slow, 0.75); } // FOCUS
function setFastSpeed() { setMode(true, speed_fast, 1.2); } // WARP

function setBreak(penalty){
    if (!invincible) {
        powerups.break = []; // destroy powerups on break
        powerups.score = [];
        invincible = true;
        score += -penalty;
    }
}

// power inputs currently held down, so releasing one can fall back to another (tfocus/twarp: the touch buttons)
var held = { shift: false, ctrl: false, lmb: false, rmb: false, tfocus: false, twarp: false };

// Input: the mouse (with keyboard) or touch. inputMode follows the last real input and picks the labels and controls.
var inputMode = (window.matchMedia && window.matchMedia("(pointer: coarse)").matches) ? "touch" : "mouse";
var lastTouchTime = 0; // when the last touch event arrived; mouse events a browser makes up after a touch are ignored
var activeTouches = 0; // fingers down
var TOUCH_GAIN = 1.25; // touch steering: the square moves 1.25px for each px the steering finger moves
var touch = { steerId: null, lastX: 0, lastY: 0, roles: {}, order: 0 }; // what each finger is doing, and which one steers
var resumeTimer = null; // the 3-2-1 countdown after a touch resume
var pauseNo = 0; // counts pauses (and cut-short countdowns): a finger lifted during the pause it came down in resumes
var layoutClick = false; // this mouse press switched the start screen to the mouse layout; its click only shows it
var rotated = false; // a phone or tablet held upright: the game is drawn turned a quarter clockwise, so it always plays landscape

function canAct() { // powers only work while playing and unpaused
    return alive && !pause;
}

function setPause(paused) { // pause or resume play; only while alive
    if (paused && pause && stopResume()) { // pausing during a touch resume countdown stops it: show the panel again
        drawPauseScreen();
        return;
    }
    if (!alive || paused == pause) {
        return;
    }
    cancelResume();
    pause = paused;
    gameArea.canvas.style.cursor = pause ? "default" : "none"; // let the player line the cursor back up with their square
    if (pause) {
        pauseStart = Date.now();
        pauseNo++;
        pausedSong = all_songs.find(function (song) { return !song.paused; }) || null;
        if (pausedSong) {
            pausedSong.pause();
        }
        aud_danger.pause();
        [aud_bomb, aud_death, aud_menuSound].forEach(function (sound) { // cut transition sounds short; rewind so they replay from the start
            sound.pause();
            sound.currentTime = 0;
        });
        drawPauseScreen();
    } else { // exclude paused time from the completion timer
        startTime += Date.now() - pauseStart;
        if (pausedSong) {
            playSound(pausedSong);
            pausedSong = null;
        }
        applyHeldSpeed(); // pick up anything pressed or released while paused
    }
}

function releaseAll() { // the player went away (window blur, app switch, a system gesture): let go of everything and pause
    held.shift = held.ctrl = held.lmb = held.rmb = held.tfocus = held.twarp = false;
    touch.roles = {};
    touch.steerId = null;
    applyHeldSpeed();
    setPause(true); // this also stops a resume countdown
}

function cancelResume() { // stop a touch resume countdown
    if (resumeTimer) {
        clearTimeout(resumeTimer);
        resumeTimer = null;
    }
}

function stopResume() { // a touch resume countdown was cut short: stay paused and wait for a new tap
    if (!resumeTimer) {
        return false;
    }
    cancelResume();
    pauseNo++; // fingers already down don't count as that tap
    return true;
}

function startResumeCountdown() { // touch resume: 3, 2, 1 (400ms each), so the player can put their thumbs down first
    if (resumeTimer || !pause || !alive) {
        return;
    }
    var n = 3;
    var beat = function () {
        resumeTimer = null;
        if (!pause || !alive) {
            return;
        }
        if (n == 0) {
            setPause(false);
            return;
        }
        drawPauseScreen(n);
        n -= 1;
        resumeTimer = setTimeout(beat, 400);
    };
    beat();
}

function drawPauseScreen(countdown) { // drawn once over the frozen frame; countdown is the touch resume's 3-2-1
    if (inputMode == "touch") {
        drawTouchPauseScreen(countdown);
        return;
    }
    useLayout();
    var centerX = LAYOUT_W / 2;
    var centerY = LAYOUT_H / 2;
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = "white";
    ctx.fillRect(centerX - 220, centerY - 70, 440, 160);
    ctx.globalAlpha = 1.0;
    ctx.textAlign = "center";
    ctx.fillStyle = "red";
    ctx.font = "60px Arial";
    ctx.fillText("PAUSED", centerX, centerY);
    ctx.fillStyle = "black";
    ctx.font = "25px Arial";
    ctx.fillText("Press P to resume", centerX, centerY + 40);
    ctx.font = "18px Arial";
    ctx.fillText("Move the cursor onto your square first", centerX, centerY + 72);
    ctx.textAlign = "start"; // the rest of the game draws left-aligned text
    useWindow();
}

function drawTouchPauseScreen(countdown) { // touch play: tap anywhere to resume (steering is relative, so nothing to line up)
    drawLevel(); // a clean frame under the panel: no hint or power message left over from the last one
    useLayout();
    var centerX = LAYOUT_W / 2;
    var centerY = LAYOUT_H / 2;
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = "white";
    ctx.fillRect(centerX - 280, centerY - 120, 560, 240);
    ctx.globalAlpha = 1.0;
    ctx.textAlign = "center";
    ctx.fillStyle = "red";
    if (countdown) {
        ctx.font = "140px Arial";
        ctx.fillText(countdown, centerX, centerY + 50);
    } else {
        ctx.font = "72px Arial";
        ctx.fillText("PAUSED", centerX, centerY - 20);
        ctx.fillStyle = "black";
        ctx.font = "40px Arial";
        ctx.fillText("TAP TO RESUME", centerX, centerY + 40);
        ctx.font = "24px Arial";
        ctx.fillText("Your square stays put. Drag to steer.", centerX, centerY + 85);
    }
    ctx.textAlign = "start";
    useWindow();
}

function applyHeldSpeed() { // set speed from whatever power is still held
    if (!canAct()) {
        return;
    }
    if (held.shift || held.lmb || held.tfocus) {
        setSlowSpeed();
    } else if (held.ctrl || held.rmb || held.twarp) {
        setFastSpeed();
    } else {
        resumeSpeed();
    }
}

function pressPower(input, activate) { // a power key or button went down: remember it, and use it now if playing
    held[input] = true;
    if (canAct()) {
        activate();
    }
}

function keyName(e) { // the game key pressed: "p", "r", " " (space), "Shift", "Control", or something else
    var key = e.key === "Spacebar" ? " " : e.key; // old Edge/IE called space "Spacebar"
    if (key && key.length == 1 && /[a-z ]/i.test(key)) {
        return key.toLowerCase(); // letters as typed, so Shift+P or Caps Lock still works
    }
    if (key == "Shift" || key == "Control") {
        return key;
    }
    // anything else: an older browser without e.key, a non-Latin keyboard layout (including letters outside the
    // basic character range, like ADLaM), a layout-switch key such as "GroupNext", or a tool that leaves key empty
    return { 16: "Shift", 17: "Control", 32: " ", 80: "p", 82: "r" }[e.keyCode] || key;
}

function tryBreak() { // Space or middle click
    if (canAct()) {
        setBreak(scorePenalty);
    }
}

function setInputMode(mode) { // switch between mouse and touch play, redrawing whatever shows labels or controls
    if (mode == inputMode) {
        return;
    }
    inputMode = mode;
    if (!gameStart) {
        drawStartScreen();
    } else if (alive && pause) {
        stopResume();
        drawLevel();
        drawPauseScreen();
    } else if (alive && mode == "mouse") {
        drawLevel(); // without the touch controls
        setPause(true); // the cursor is somewhere else: pause so the player can line it up with the square
    }
}

function screenUpright() { // the device is held upright (a tall window alone could be split screen on a landscape tablet)
    var type = window.screen && screen.orientation && screen.orientation.type;
    if (type) {
        return type.indexOf("portrait") == 0;
    }
    if (typeof window.orientation == "number") { // older iOS Safari
        return window.orientation % 180 == 0;
    }
    return true;
}

function toGame(sx, sy) { // a window point (clientX/Y or pageX/Y) in game coordinates; they differ only while the game is turned
    return rotated ? { x: sy, y: gameArea.canvas.height - sx } : { x: sx, y: sy };
}

function touchEcho(e) { // a mouse event the browser made up after a touch
    return Date.now() - lastTouchTime < 800 || !!(e.sourceCapabilities && e.sourceCapabilities.firesTouchEvents);
}

function touchButtons() { // the on-screen power buttons for touch play, in window pixels (worked out from the window size)
    var W = gameArea.canvas.width;
    var H = gameArea.canvas.height;
    var u = Math.min(W, H);
    var big = Math.max(64, Math.min(96, 0.22 * u)) / 2; // radii
    var small = Math.max(56, Math.min(80, 0.17 * u)) / 2;
    var gap = 16;
    var focus = { x: W - 20 - big, y: H - 24 - big, r: big }; // FOCUS in the corner, where the thumb rests
    var brk, warp;
    if (W >= H) { // landscape: BREAK to its left, WARP above it
        brk = { x: focus.x - big - gap - small, y: H - 24 - small, r: small };
        warp = { x: focus.x, y: focus.y - big - gap - small, r: small };
    } else { // portrait: a column up the right edge, where obstacles come in
        brk = { x: focus.x, y: focus.y - big - gap - small, r: small };
        warp = { x: focus.x, y: brk.y - small - gap - small, r: small };
    }
    var pad = 14;
    return {
        tfocus: focus, twarp: warp, "break": brk,
        pause: { x: W - 12 - 48, y: 12, w: 48, h: 48 },
        box: { left: Math.min(focus.x - focus.r, brk.x - brk.r, warp.x - warp.r) - pad, top: Math.min(warp.y - warp.r, brk.y - brk.r) - pad },
    };
}

function touchButtonAt(px, py) { // "tfocus", "twarp", "break", "pause" or "" for a touch at a window point
    var tb = touchButtons();
    var p = tb.pause;
    if (px >= p.x && px <= p.x + p.w && py >= p.y && py <= p.y + p.h) {
        return "pause";
    }
    if (px < tb.box.left || py < tb.box.top) {
        return "";
    }
    var best = "";
    var bestDistance = Infinity;
    ["tfocus", "break", "twarp"].forEach(function (name) { // anywhere near the cluster counts as its nearest button
        var d = Math.sqrt(Math.pow(px - tb[name].x, 2) + Math.pow(py - tb[name].y, 2));
        if (d < bestDistance) {
            bestDistance = d;
            best = name;
        }
    });
    return best;
}

function drawTouchControls() { // touch play: the power buttons and pause icon, over the obstacles and under the square
    if (inputMode != "touch" || !alive) {
        return;
    }
    var tb = touchButtons();
    ctx.save();
    useWindow();
    [["tfocus", "FOCUS", "#00FFFF", held.tfocus], ["twarp", "WARP", "#ff0000", held.twarp], ["break", "BREAK", "#FFD700", false]].forEach(function (b) {
        var c = tb[b[0]];
        ctx.globalAlpha = b[3] ? 0.45 : (b[0] == "break" && invincible ? 0.06 : 0.15);
        ctx.fillStyle = b[2];
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 0.9; // a white halo, then a colored ring, so the buttons show on white and on black columns
        ctx.lineWidth = 5;
        ctx.strokeStyle = "white";
        ctx.stroke();
        ctx.globalAlpha = 0.6;
        ctx.lineWidth = 3;
        ctx.strokeStyle = b[2];
        ctx.stroke();
        ctx.globalAlpha = 0.9;
        ctx.font = "bold " + Math.round(0.4 * c.r) + "px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.lineWidth = 3; // a white outline keeps the label readable over a black column
        ctx.strokeStyle = "white";
        ctx.strokeText(b[1], c.x, c.y);
        ctx.fillStyle = "#222";
        ctx.fillText(b[1], c.x, c.y);
    });
    if (invincible) { // BREAK's ring drains as the break runs out
        var c = tb["break"];
        ctx.globalAlpha = 0.9;
        ctx.lineWidth = 4;
        ctx.strokeStyle = "#FFD700";
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.r + 6, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.max(0, 1 - invincibleTime / invincibleTimeMax));
        ctx.stroke();
    }
    var p = tb.pause; // pause icon: two bars, outlined in white like the labels
    ctx.globalAlpha = 0.6;
    ctx.fillStyle = "white";
    ctx.fillRect(p.x + 12, p.y + 8, 11, 32);
    ctx.fillRect(p.x + 25, p.y + 8, 11, 32);
    ctx.globalAlpha = 0.4;
    ctx.fillStyle = "black";
    ctx.fillRect(p.x + 14, p.y + 10, 7, 28);
    ctx.fillRect(p.x + 27, p.y + 10, 7, 28);
    ctx.restore();
}

function steerBy(dx, dy) { // touch steering is relative: move the square's target by the finger's movement
    if (gameArea.x === undefined) { // no target yet: start from where the square is
        gameArea.x = gamePiece.x + gamePiece.width / 2;
        gameArea.y = gamePiece.y + gamePiece.height / 2;
    }
    gameArea.x = Math.max(0, Math.min(gameArea.canvas.width, gameArea.x + dx * TOUCH_GAIN));
    gameArea.y = Math.max(0, Math.min(gameArea.canvas.height, gameArea.y + dy * TOUCH_GAIN));
    setPieceSize(pieceSize());
}

function forgetTouch(id) { // a finger is gone: release its power and hand steering to the newest other steering finger
    var info = touch.roles[id];
    delete touch.roles[id];
    if (!info) {
        return null;
    }
    if (info.role == "tfocus" || info.role == "twarp") { // released once no other finger holds the same button
        held[info.role] = false;
        for (var k in touch.roles) {
            if (touch.roles[k].role == info.role) {
                held[info.role] = true;
            }
        }
        applyHeldSpeed();
    }
    if (id === touch.steerId) {
        touch.steerId = null;
        var next = null;
        for (var other in touch.roles) {
            var o = touch.roles[other];
            if (o.role == "steer" && (!next || o.order > next.order)) {
                next = o;
            }
        }
        if (next) { // continue from where that finger is, so the square doesn't jump
            touch.steerId = next.id;
            touch.lastX = next.x;
            touch.lastY = next.y;
        }
    }
    return info;
}

function reconcileTouches(list) { // let go of any finger the browser no longer reports (a lost touchend)
    var down = {};
    for (var i = 0; i < list.length; i++) {
        down[list[i].identifier] = true;
    }
    for (var id in touch.roles) {
        if (!down[id]) {
            forgetTouch(touch.roles[id].id);
        }
    }
    activeTouches = list.length;
}

function onTouchStart(e) {
    if (e.cancelable) {
        e.preventDefault(); // no scrolling, zooming or made-up mouse events
    }
    lastTouchTime = Date.now();
    reconcileTouches(e.touches);
    window.focus(); // as for mouse clicks: an embedded game needs focus to receive keys and stay unpaused
    var wasTouch = inputMode == "touch";
    setInputMode("touch");
    for (var i = 0; i < e.changedTouches.length; i++) {
        var t = e.changedTouches[i];
        var p = toGame(t.clientX, t.clientY);
        var info = { id: t.identifier, x: p.x, y: p.y, order: ++touch.order, role: "none", pausedAt: pause ? pauseNo : -1, switched: !wasTouch };
        if (!gameStart) {
            setHovered(buttonAt(p.x, p.y)); // press feedback
        } else if (runFinished) {
            if (Date.now() - finishTime >= 1000) {
                restartArmed = true; // same rule as a mouse click: only a touch that starts on the finish screen, after 1s
            }
        } else {
            // the buttons also work between levels, so FOCUS or WARP held into the next level starts in it (as with the mouse);
            // a touch that switches from mouse play steers, as the buttons weren't showing
            var button = wasTouch ? touchButtonAt(p.x, p.y) : "";
            info.role = button || "steer"; // a finger keeps its role until it lifts, even if it slides off its button
            if (button == "tfocus") {
                pressPower("tfocus", setSlowSpeed);
            } else if (button == "twarp") {
                pressPower("twarp", setFastSpeed);
            } else if (button == "break") {
                tryBreak();
            } else if (!button) { // the newest steering finger steers
                touch.steerId = t.identifier;
                touch.lastX = p.x;
                touch.lastY = p.y;
            }
        }
        touch.roles[t.identifier] = info;
    }
}

function onTouchMove(e) {
    if (e.cancelable) {
        e.preventDefault();
    }
    lastTouchTime = Date.now();
    reconcileTouches(e.touches);
    for (var i = 0; i < e.changedTouches.length; i++) {
        var t = e.changedTouches[i];
        var p = toGame(t.clientX, t.clientY);
        var info = touch.roles[t.identifier];
        if (!info) {
            continue;
        }
        info.x = p.x;
        info.y = p.y;
        if (!gameStart) {
            setHovered(buttonAt(p.x, p.y));
        } else if (t.identifier === touch.steerId) {
            var dx = p.x - touch.lastX;
            var dy = p.y - touch.lastY;
            touch.lastX = p.x; // movement while paused or between levels is dropped, not saved up
            touch.lastY = p.y;
            if (alive && !pause && !resumeTimer) {
                steerBy(dx, dy);
            }
        }
    }
}

function onTouchEnd(e) { // touchend and touchcancel
    if (e.cancelable) {
        e.preventDefault();
    }
    lastTouchTime = Date.now();
    var last = null;
    var switched = false; // the lifted finger switched the start screen from the mouse layout
    for (var i = 0; i < e.changedTouches.length; i++) {
        var t = e.changedTouches[i];
        var p = toGame(t.clientX, t.clientY);
        last = p;
        var info = forgetTouch(t.identifier);
        switched = !!(info && info.switched);
        if (!info || e.type == "touchcancel") {
            continue;
        }
        if (info.role == "pause" && (!pause || resumeTimer) && touchButtonAt(p.x, p.y) == "pause") { // also stops a countdown
            setPause(true);
        } else if (pause && info.pausedAt == pauseNo && Date.now() - pauseStart > 300) { // began during this pause
            startResumeCountdown(); // a tap anywhere resumes (after the pause has been up for a moment)
        }
    }
    reconcileTouches(e.touches);
    if (e.type == "touchcancel") {
        if (!gameStart && e.touches.length === 0) {
            setHovered(""); // no start-screen button stays pressed
        }
        if (alive) {
            releaseAll(); // a system gesture took the touch: pause rather than let the player die
        }
        return;
    }
    if (e.touches.length === 0 && last) {
        if (!gameStart) {
            var button = buttonAt(last.x, last.y);
            setHovered("");
            if (switched) {
                // this tap switched the start screen to the touch layout; it only shows it
            } else if (button && button != "start") {
                alert(START_BUTTONS[button].touchHelp);
            } else {
                startTouchGame(); // a tap anywhere else starts (it has to be on touchend for sound to be allowed)
            }
        } else if (runFinished && restartArmed) {
            restartRun();
        }
    }
}

function endBreak() { // back to normal after a Break
    invincible = false;
    invincibleTime = 0;
    gamePiece.color = gamePieceColor;
}

var gameArea = {
    canvas: document.createElement("canvas"),
    load: function () {
        this.tall = window.innerHeight > window.innerWidth;
        // phones and tablets always play landscape: held upright, the canvas is turned a quarter clockwise
        // (orientation locking needs fullscreen on Android and isn't available on iOS)
        rotated = this.tall && screenUpright() && !!(window.matchMedia && window.matchMedia("(hover: none) and (pointer: coarse)").matches);
        this.canvas.width = rotated ? window.innerHeight : window.innerWidth;
        this.canvas.height = rotated ? window.innerWidth : window.innerHeight;
        this.canvas.style.transformOrigin = "0 0";
        this.canvas.style.transform = rotated ? "rotate(90deg) translateY(-100%)" : "";
        x = this.canvas.width; // the screens are drawn across the whole canvas
        y = this.canvas.height;
        if (this.inputBound) {
            return; // load() re-runs on resize; only insert the canvas and register input listeners once
        }
        this.inputBound = true;
        document.body.insertBefore(this.canvas, document.body.childNodes[0]);
        var touchOptions = { passive: false }; // so preventDefault can stop scrolling, zooming and made-up mouse events
        this.canvas.addEventListener("touchstart", onTouchStart, touchOptions);
        this.canvas.addEventListener("touchmove", onTouchMove, touchOptions);
        this.canvas.addEventListener("touchend", onTouchEnd, touchOptions);
        this.canvas.addEventListener("touchcancel", onTouchEnd, touchOptions);
        document.addEventListener("gesturestart", function (e) { e.preventDefault(); }, touchOptions); // iOS pinch zoom
        document.addEventListener("gesturechange", function (e) { e.preventDefault(); }, touchOptions);
        window.addEventListener("orientationchange", function () { setTimeout(windowResize, 300); }); // iOS can report the new size late
        document.addEventListener("visibilitychange", function () {

            }
        });
        window.addEventListener("pagehide", releaseAll);
        window.addEventListener('click', function (e) {
            if (touchEcho(e)) {
                return;
            }
            if (layoutClick) { // the press switched the start screen to the mouse layout; the click only shows it
                layoutClick = false;
                return;
            }
            var p = toGame(e.pageX, e.pageY);
            var button = gameStart ? "" : buttonAt(p.x, p.y);
            if (button == "start") {
                startGame({ pageX: p.x, pageY: p.y });
            } else if (button) { // a control button: explain it
                alert(START_BUTTONS[button].help);
            } else if (runFinished && restartArmed) { // play again from the finish screen
                restartRun();
            }
        });
        window.addEventListener('mousedown', function (e) {
            e.preventDefault();
            if (touchEcho(e)) {
                return;
            }
            layoutClick = !gameStart && !activeTouches && inputMode != "mouse";
            if (!activeTouches) {

            }
            window.focus(); // preventDefault stops the page taking focus when embedded in an iframe
            if (e.button == 0 && runFinished && Date.now() - finishTime >= 1000) {

                // so a Focus tap as level 15 ends doesn't wipe the results before they're seen
                restartArmed = true;
            }
            if (e.button == 0) { // left mouse button = FOCUS
                pressPower("lmb", setSlowSpeed);
            }
            if (e.button == 2) { // right mouse button = WARP
                pressPower("rmb", setFastSpeed);
            }
            if (e.button == 1) { // middle mouse button = BREAK
                tryBreak();
            }
        });
        window.addEventListener('mouseup', function (e) {
            e.preventDefault();
            if (touchEcho(e)) {
                return;
            }

            if (released) {

        });
        window.addEventListener('mousemove', function (e) {

            }

            }

            }

            var lmb = (e.buttons & 1) != 0;
            var rmb = (e.buttons & 2) != 0;

                held.lmb = lmb;
                held.rmb = rmb;
                held.shift = e.shiftKey;
                held.ctrl = e.ctrlKey;

            }
            if (gameStart) { // the square follows the cursor (movePiece moves it there each frame)
                var p = toGame(e.pageX, e.pageY);

        });
        window.addEventListener('blur', releaseAll); // releases aren't seen while the window is unfocused; don't keep playing
        window.addEventListener('keydown', function (e) {
            var key = keyName(e);
            if (alive && e.ctrlKey) {

            }

            }
            if (key == "Control") { // CTRL = WARP

        window.addEventListener('keyup', function (e) {

    },
    start: function () {
        this.canvas.style.cursor = "none"; // hide the original cursor
        this.frameNo = 0;
        this.spawnClock = 0; // game time for spawning, advanced by the game speed each step
        fxReset(); // no fade, trail or echo carried into the level
        this.stop(); // never run two loops
        this.running = true;
        this.lastTime = performance.now();
        this.pendingTime = 0;
        this.frameRequest = requestAnimationFrame(runSteps);
    },
    clear: function () {
        this.context.clearRect(0, 0, this.canvas.width, this.canvas.height);

    stop: function () {
