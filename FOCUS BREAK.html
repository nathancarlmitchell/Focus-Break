<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
    <style>
        html, body { margin: 0; padding: 0; } /* canvas fills the window so page and canvas coordinates match */
        html { overflow: hidden; } /* no scrollbars; not on body, which would clip the turned canvas to its untransformed box */
        canvas { display: block; }
        /* touch play: no scrolling, pull-to-refresh, zooming, text selection, long-press menu or tap highlight */
        html, body, canvas { touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none;
            -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body onload="onLoad()" onresize="windowResize()" oncontextmenu="return false;">
    <audio id="audio01" src="music/Cavalier - Vol. 8 - 01 Before U Go.mp3"></audio>
    <audio id="audio02" src="music/Cavalier - Vol. 8 - 02 Reflex.mp3"></audio>
    <audio id="audio03" src="music/Cavalier - Vol. 8 - 03 Blood (feat. Fifty Grand).mp3"></audio>
    <audio id="audio04" src="music/Cavalier - Vol. 8 - 04 Undefined.mp3"></audio>
    <audio id="audio05" src="music/Cavalier - Vol. 8 - 05 Lay.mp3"></audio>
    <audio id="audio06" src="music/Cavalier - Vol. 8 - 06 Kitty Kat.mp3"></audio>
    <audio id="audio07" src="music/Cavalier - Vol. 8 - 07 Too Late.mp3"></audio>
    <audio id="audio08" src="music/Cavalier - Vol. 8 - 08 Midnight (Cavalier Version).mp3"></audio>
    <audio id="audio09" src="music/Cavalier - Vol. 8 - 09 Commas.mp3"></audio>
    <audio id="audio10" src="music/Cavalier - Vol. 8 - 10 Gone.mp3"></audio>
    <audio id="audio11" src="music/Cavalier - Vol. 8 - 11 Love U.mp3"></audio>
    <audio id="bombSFX" src="music/BOMB_SIREN-BOMB_SIREN-247265934.wav"></audio>
    <audio id="fx11" src="music/Fx 11.wav"></audio>
    <audio id="fx14" src="music/Fx 14.wav"></audio>
    <audio id="danger" src="music/72.wav"></audio>
    <audio id="menusound2" src="music/Menu Sounds_2.wav"></audio>
    <audio id="fx_powerUp" src="music/powerUp.wav"></audio>
    <audio id="fx_pickupCoin" src="music/pickupCoin.wav"></audio>
    <audio id="fx_click" src="music/click.wav"></audio>
<script>

// initialize audio
const all_songs = ["01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11"].map(function (n) {
    return document.getElementById("audio" + n);
});

function sfx(id, volume) { // look up a sound effect, optionally setting its volume
    var sound = document.getElementById(id);
    if (volume !== undefined) {
        sound.volume = volume;
    }
    return sound;
}
const aud_bomb = sfx("bombSFX", 0.3);
const aud_menuSound = sfx("menusound2", 0.2);
const aud_death = sfx("fx14", 0.15);
const aud_danger = sfx("danger", 0.05);
const aud_powerUp = sfx("fx_powerUp", 0.1);
const aud_pickupCoin = sfx("fx_pickupCoin", 0.1);
const aud_click = sfx("fx_click", 0.1);
const aud_startup = sfx("fx11");
var musicVolume = 0.2;


// Screens (start, level transitions, finish, pause) are laid out for a LAYOUT_W x LAYOUT_H window and scaled to fit
// the actual window, centered, so they never run off screen. Gameplay stays in window pixels. Only the start screen
// fills the whole frame; the rest are fitted to the band they actually use instead -- see fitBand and useBand below.
var LAYOUT_W = 1280;
var LAYOUT_H = 800;

// start-screen buttons, relative to the center of the layout; used for drawing, hover and clicks
// `touch` is the bigger layout used for touch play (labels centered in the boxes)
const START_BUTTONS = {
    start: { dx: -410, dy: -32, w: 220, h: 44, hitH: 46, // clickable area is 2px taller than the drawn box
        touch: { dx: -450, dy: -60, w: 400, h: 150 } },
    break: { dx: 0, dy: 0, w: 272, h: 40, label: "Space to Break", ty: 38,
        help: "SPACEBAR or MIDDLE MOUSE BUTTON = BREAK - Become invincible briefly.  Lose score, emergency use only!",
        touch: { dx: 60, dy: -150, w: 420, h: 110 }, touchLabel: "Tap to Break",
        touchHelp: "BREAK button (tap) = Become invincible briefly.  Lose 250 score, emergency use only!  Drag anywhere to steer." },
    focus: { dx: 0, dy: 60, w: 272, h: 40, label: "Shift to Focus", ty: 100,
        help: "SHIFT or LEFT MOUSE BUTTON = FOCUS - Slows time and decrease hitbox size.  Earn no score, use in a tight spot.",
        touch: { dx: 60, dy: -20, w: 420, h: 110 }, touchLabel: "Hold to Focus",
        touchHelp: "FOCUS button (hold) = Slows time and shrinks your hitbox.  Earn no score, use in a tight spot.  Drag anywhere to steer." },
    warp: { dx: 0, dy: 120, w: 272, h: 40, label: "Click to warp", ty: 160,
        help: "CTRL or RIGHT MOUSE BUTTON: WARP - Speeds up time.  Earn double score, you madman.",
        touch: { dx: 60, dy: 110, w: 420, h: 110 }, touchLabel: "Hold to Warp",
        touchHelp: "WARP button (hold) = Speeds up time.  Earn double score, you madman.  Drag anywhere to steer." },
    // the two that aren't the game or a control: the run's difficulty, under START because it decides the run,
    // and the settings, which open a screen of their own
    difficulty: { dx: -410, dy: 85, w: 220, h: 40, setting: "difficulty",
        touch: { dx: -450, dy: 110, w: 400, h: 90 } },
    options: { dx: 0, dy: 272, w: 256, h: 40, menu: "options",
        touch: { dx: 60, dy: 240, w: 200, h: 90 } },
    help: { dx: 276, dy: 272, w: 256, h: 40, menu: "help",
        touch: { dx: 280, dy: 240, w: 200, h: 90 } },
};

var menuScreen = ""; // which menu screen is up: "" for none, "options" for the settings, "help" for the
                     // instructions. The instructions are the one that can also come up over a paused level

function menuUp() {
    return menuScreen != "";
}

// the settings screen's own buttons. One layout for both mouse and touch: it is a menu of its own, with room to be
// read either way, so there is nothing for the start screen's two layouts to disagree about
const OPTION_BUTTONS = {
    options_effects: { dx: -300, dy: -136, w: 600, h: 78, setting: "options" },
    options_steering: { dx: -300, dy: -48, w: 600, h: 78, setting: "steering" },
    options_buttons: { dx: -300, dy: 40, w: 600, h: 78, setting: "buttons" },
    options_back: { dx: -170, dy: 190, w: 340, h: 70, back: true, label: "BACK" },
};

function buttonTable() { // whichever screen's buttons are live
    return menuScreen == "options" ? OPTION_BUTTONS : menuScreen == "help" ? HELP_BUTTONS : START_BUTTONS;
}

function buttonDef(name) { // a live button's definition, for the things that only need its flags
    return buttonTable()[name];
}

const FX_MODES = ["auto", "full", "reduced", "off"]; // what the effects button cycles through
const FX_MODE_LABELS = { auto: "Auto", full: "Full", reduced: "Reduced", off: "Off" };
const TOUCH_GAINS = [0.75, 1, 1.25, 1.5, 2]; // px the square moves per px of finger; 1.25 is what it always was
const TOUCH_SIDES = ["right", "left"]; // the edge the power buttons sit against, for the hand that holds the phone

function fxModeLabel() { // what the effects button reads: for "auto", also what the device is asking for
    var name = FX_MODE_LABELS[fxMode] || fxMode;
    return fxMode == "auto" ? name + " (" + FX_MODE_LABELS[fxLook()] + ")" : name;
}

// each setting is a value cycled by its own button and remembered between runs. read() is what the button says,
// pick() takes a stored string and returns the value to use, or undefined if it isn't one of ours
const SETTINGS = {
    options: { store: "focusbreak.effects",
        read: function () { return "EFFECTS: " + fxModeLabel().toUpperCase(); },
        next: function () { fxMode = FX_MODES[(FX_MODES.indexOf(fxMode) + 1) % FX_MODES.length]; return fxMode; },
        pick: function (v) { return FX_MODES.indexOf(v) >= 0 ? v : undefined; },
        apply: function (v) { fxMode = v; } },
    steering: { store: "focusbreak.steering",
        read: function () { return "STEERING: " + TOUCH_GAIN.toFixed(2) + "x"; },
        next: function () {
            var i = TOUCH_GAINS.indexOf(TOUCH_GAIN); // an unlisted value (an old save, a hand edit) steps to the first
            TOUCH_GAIN = TOUCH_GAINS[(i + 1) % TOUCH_GAINS.length];
            return String(TOUCH_GAIN);
        },
        pick: function (v) { return TOUCH_GAINS.indexOf(parseFloat(v)) >= 0 ? parseFloat(v) : undefined; },
        apply: function (v) { TOUCH_GAIN = v; } },
    difficulty: { store: "focusbreak.difficulty", // its button is on the start screen, but it is stored like the rest
        read: function () { return mode().label; },
        next: function () {
            var i = 0;
            while (i < DIFFICULTIES.length && DIFFICULTIES[i].name != difficulty) { i++; }
            difficulty = DIFFICULTIES[(i + 1) % DIFFICULTIES.length].name;
            return difficulty;
        },
        pick: function (v) {
            for (var i = 0; i < DIFFICULTIES.length; i++) {
                if (DIFFICULTIES[i].name === v) { return v; }
            }
            return undefined;
        },
        apply: function (v) { difficulty = v; } },
    buttons: { store: "focusbreak.buttons",
        read: function () { return "BUTTONS: " + TOUCH_SIDE.toUpperCase(); },
        next: function () {
            TOUCH_SIDE = TOUCH_SIDES[(TOUCH_SIDES.indexOf(TOUCH_SIDE) + 1) % TOUCH_SIDES.length];
            return TOUCH_SIDE;
        },
        pick: function (v) { return TOUCH_SIDES.indexOf(v) >= 0 ? v : undefined; },
        apply: function (v) { TOUCH_SIDE = v; } },
};

function loadSettings() { // whatever was chosen last time, if the browser will tell us
    for (var name in SETTINGS) {
        var s = SETTINGS[name];
        try {
            var saved = s.pick(window.localStorage.getItem(s.store));
            if (saved !== undefined) {
                s.apply(saved);
            }
        } catch (e) { // private windows and blocked storage throw rather than return null: keep the default
        }
    }
}

function cycleSetting(name) { // a settings button: step to its next value and remember it
    var s = SETTINGS[name];
    var value = s.next();
    try {
        window.localStorage.setItem(s.store, value);
    } catch (e) { // nothing to do: the setting still applies for this run
    }
    playSound(aud_click);
    drawStartScreen();
}
// The four difficulties, picked on the start screen because they define a run rather than configure one. Two levers
// between them: lives, which make a death keep the level's score instead of wiping it, and a per-level ration of power
// activations. Normal is the game as it always was, and is what a save with nothing in it opens on.
const DIFFICULTIES = [
    { name: "easy", label: "EASY 簡単", lives: 3, powers: null }, // powers: null is no ration at all
    { name: "normal", label: "NORMAL 普通", lives: 0, powers: null },
    { name: "hard", label: "HARD 難しい", lives: 0, powers: 3 },
    { name: "true", label: "TRUE 真", lives: 0, powers: 0 },
];
var difficulty = "normal";
var runLives = 0; // lives left this run, and power activations left this level
var runPowers = null;
var lifeSpent = false; // the death being shown was paid for with a life

function mode() { // the difficulty in force
    for (var i = 0; i < DIFFICULTIES.length; i++) {
        if (DIFFICULTIES[i].name == difficulty) {
            return DIFFICULTIES[i];
        }
    }
    return DIFFICULTIES[1]; // normal, if a stored name ever gets past the check that should have caught it
}

function startRunRations() { // a run begins: the lives are its own, the powers are the first level's
    runLives = mode().lives;
    startLevelRations();
}

function startLevelRations() { // and every level after that gets its powers back
    runPowers = mode().powers;
}

function powerRunning() { // which power the game is in the middle of, so holding one isn't charged for twice
    return speed == speed_slow ? "focus" : speed == speed_fast ? "warp" : "";
}

function powerAllowed(name) { // hard and true ration activations: holding one is free, starting one is not
    if (runPowers === null || name == powerRunning()) {
        return true;
    }
    if (runPowers <= 0) {
        return false; // out: the button does nothing at all, which is the whole of TRUE mode
    }
    runPowers--;
    return true;
}

function runStatusText() { // what this difficulty is rationing, for the HUD, or "" when it is rationing nothing
    var d = mode();
    if (d.lives > 0) {
        return "LIVES " + runLives;
    }
    if (d.powers === 0) {
        return "NO POWERS";
    }
    if (d.powers !== null) {
        return "POWERS " + runPowers;
    }
    return "";
}

// Records. The game timed a run to the second, printed it on the finish screen and then threw it away: nothing about
// a run survived it, so a flawless fifteen levels and a scrappy one left the same trace, which was none. Kept as one
// JSON blob beside the settings and read the same defensive way -- a private window throws rather than returning null,
// and a half-written or hand-edited value must not be what stops the game starting.
var RECORDS_STORE = "focusbreak.records";
var RUN_LEVELS = 15; // levels in a full run; level 16 is the finish screen, not a level

var records = { modes: {} }; // a set per difficulty: a best on EASY is not a best on TRUE, and mixing them
                             // would let the easiest mode set a time the hardest could never beat

function rec() { // the record set for the difficulty now selected
    if (!records.modes[difficulty]) {
        records.modes[difficulty] = {
            run: null, // fastest completed run, in ms
            runDeaths: 0, // and what it cost
            level: {}, // fastest clear of each level, in ms: the split
            reached: 0, // furthest level started, so a run that never finishes still leaves a mark
        };
    }
    return records.modes[difficulty];
}
var levelStart = 0; // when the level being played began (ms), moved forward by time spent paused, as startTime is
var levelBeat = 0; // how long the level just cleared took, and whether that is the best it has been
var levelRecord = false;

var RECORD_MAX_MS = 86400000; // a day: past this a stored time is not a run, and printing it would look broken

function storedTime(v) { // a stored number we are willing to believe
    return typeof v == "number" && isFinite(v) && v > 0 && v <= RECORD_MAX_MS ? v : null;
}

function loadRecords() { // whatever previous runs left, if the browser will tell us
    try {
        var got = JSON.parse(window.localStorage.getItem(RECORDS_STORE));
        if (!got || typeof got != "object" || !got.modes || typeof got.modes != "object") {
            return;
        }
        records.modes = {}; // what was stored replaces what is held, rather than merging into it
        for (var i = 0; i < DIFFICULTIES.length; i++) {
            var name = DIFFICULTIES[i].name;
            var from = got.modes[name];
            if (!from || typeof from != "object") {
                continue; // a mode never played, or something that isn't a record set
            }
            var to = { run: storedTime(from.run), runDeaths: storedTime(from.runDeaths) || 0,
                reached: Math.min(RUN_LEVELS, storedTime(from.reached) || 0), level: {} };
            if (from.level && typeof from.level == "object") {
                for (var n = 1; n <= RUN_LEVELS; n++) {
                    var split = storedTime(from.level[n]);
                    if (split) {
                        to.level[n] = split;
                    }
                }
            }
            records.modes[name] = to;
        }
    } catch (e) { // blocked storage, a private window, or something that isn't JSON: play without them
    }
}

function saveRecords() {
    try {
        window.localStorage.setItem(RECORDS_STORE, JSON.stringify(records));
    } catch (e) { // nothing to do: the records still hold for this session
    }
}

function reachedLevel(n) { // a level began: the furthest one reached is a record of its own for a run that never ends
    if (n > rec().reached && n <= RUN_LEVELS) {
        rec().reached = n;
        saveRecords();
    }
}

function recordLevel(n) { // a level was cleared: its split, and whether that is the fastest it has been flown
    levelBeat = Date.now() - levelStart;
    levelRecord = !rec().level[n] || levelBeat < rec().level[n];
    if (levelRecord) {
        rec().level[n] = levelBeat;
        saveRecords();
    }
}

function recordRun(ms, cost) { // all fifteen cleared: the run's time, against the best there has been
    var beat = !rec().run || ms < rec().run;
    if (beat) {
        rec().run = ms;
        rec().runDeaths = cost;
        saveRecords();
    }
    return beat;
}

function splitText(ms) { // a level takes seconds, not minutes: m:ss would round away the difference between two runs
    return (ms / 1000).toFixed(1) + "s";
}

function mistakes(n) {
    return n + (n == 1 ? " mistake" : " mistakes");
}

function recordsLine() { // what the start screen has to say about how this has gone before, or "" the first time
    if (rec().run) {
        return "BEST " + millisToMinutesAndSeconds(rec().run) + "   " + mistakes(rec().runDeaths);
    }
    if (rec().reached > 1) {
        return "FURTHEST   Level " + rec().reached;
    }
    return "";
}

var hoveredButton = ""; // start-screen button under the mouse (or finger)

function startLayout() { // "classic" (the original mouse layout) or "touch" (bigger, centered buttons)
    return inputMode == "touch" ? "touch" : "classic";
}

function geom(name) { // a live button's rectangle, or null if it isn't on the screen that is up
    if (menuUp()) {
        return buttonTable()[name] || null; // a menu screen has one layout, so there is nothing to choose
    }
    var b = START_BUTTONS[name];
    if (!b) {
        return null;
    }
    var style = startLayout();
    return style == "classic" ? (b.touchOnly ? null : b) : b[style];
}

// The menu glitches. Every so often a piece of the start screen tears, ghosts or gets crushed for a moment, and then
// the screen is drawn clean again. All three kinds are self-copies of what is already on the canvas -- nothing is
// redrawn from the model, so whatever a piece looked like is what tears.
// Its randomness is fxHash off a counter, not Math.random, for the reason the effects have that rule: Math.random
// is the stream the spawns come out of, and this runs on a timer, so how many draws it takes before a run starts
// depends on how long the start screen sat there. The flashers already burned a few dozen that way; this would have
// burned a thousand, which is enough to make a seeded run unreproducible.
var GLITCH_EVERY = 220; // ms between rolls
// The menu arrives broken and settles. It comes up glitching hard for about the first two seconds, eases off
// over those rolls, and then sits at a rate you notice rather than watch: roughly one every six seconds.
var GLITCH_ARRIVE = 0.9; // how many rolls break something on the very first one
var GLITCH_CHANCE = 0.035; // and how many once it has settled
var GLITCH_SETTLE = 10; // rolls it takes to get from one to the other, about two seconds
var GLITCH_HOLD = 90; // ms the damage stays up before a clean redraw takes it away
var GLITCH_SHOVE = 26; // px a torn band can slide, in layout units
var GLITCH_BAND = 26; // and how thick a torn or tinted band is. Absolute, not a fraction of what it is breaking:
                      // sized by the victim, a glitch on a button tears and the same one on the whole screen
                      // came out as three giant slabs instead
var glitchClear = null; // the timer that will draw it clean
var glitchNo = 0; // which roll this is; everything about it is hashed off this and a slot number
var glitchSeed = Date.now() & 0xffff; // so two loads don't break in exactly the same places. A clock, not
                                      // Math.random: that one belongs to the spawns. Tests pin it to 0

function glitchRand(slot) { // repeatable within a load, and out of the spawns' way
    return fxHash(glitchSeed + glitchNo, slot);
}

function glitchChance() { // hot on arrival, easing to rare over the first couple of seconds
    var settled = Math.min(1, (glitchNo - 1) / GLITCH_SETTLE);
    return GLITCH_ARRIVE + (GLITCH_CHANCE - GLITCH_ARRIVE) * settled;
}

function glitchTargets() { // the pieces it can pick on, in layout coordinates
    var out = [
        { x: 110, y: 135, w: 620, h: 200 }, // the title, and the Japanese line under it
        { x: 90, y: 85, w: 420, h: 50 }, // the slogan
        { x: 0, y: 70, w: LAYOUT_W, h: LAYOUT_H - 140 }, // and sometimes the lot, inside the banners
    ];
    ["start", "break", "focus", "warp", "difficulty", "options"].forEach(function (name) {
        var g = geom(name);
        if (g) {
            out.push({ x: LAYOUT_W / 2 + g.dx - 6, y: LAYOUT_H / 2 + g.dy - 6, w: g.w + 12, h: g.h + 12 });
        }
    });
    if (recordsLine()) {
        out.push(startLayout() == "classic" ? { x: 230, y: 552, w: 400, h: 34 } : { x: 180, y: 660, w: 440, h: 44 });
    }
    return out;
}

function glitchShove(x, y, w, h, dx) { // slide a band sideways, and leave white where it was
    x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h); dx = Math.round(dx);
    if (w <= 0 || h <= 0 || dx == 0) {
        return;
    }
    ctx.drawImage(gameArea.canvas, x, y, w, h, x + dx, y, w, h);
    ctx.fillStyle = "#ffffff"; // the strip the band left behind, in the screen's own white
    ctx.fillRect(dx > 0 ? x : x + w + dx, y, Math.abs(dx), h);
}

function glitchTear(r, s) { // the piece comes apart in bands, each sliding its own way
    var bands = Math.max(2, Math.min(14, Math.round(r.h / Math.max(3, GLITCH_BAND * s))));
    var bh = r.h / bands;
    for (var i = 0; i < bands; i++) {
        if (glitchRand(10 + i * 2) < 0.3) {
            continue; // not every band moves, or it reads as a wobble rather than a break
        }
        glitchShove(r.x, r.y + i * bh, r.w, bh, (glitchRand(11 + i * 2) - 0.5) * 2 * GLITCH_SHOVE * s);
    }
}

function glitchGhost(r, s) { // a second copy pulls out sideways, tinted: the two colours the screen already wears
    var dx = Math.round((glitchRand(40) < 0.5 ? -1 : 1) * (3 + glitchRand(41) * 7) * s);
    var x = Math.round(r.x), y = Math.round(r.y), w = Math.round(r.w), h = Math.round(r.h);
    if (w <= 0 || h <= 0 || dx == 0) {
        return;
    }
    ctx.globalAlpha = 0.45;
    ctx.drawImage(gameArea.canvas, x, y, w, h, x + dx, y, w, h);
    ctx.globalAlpha = 0.22; // tinted in bands rather than as one flat box, so it reads as colour noise
    ctx.fillStyle = dx < 0 ? "#00FFFF" : "#ff00ff";
    for (var i = 0; i < 4; i++) {
        var bh = Math.min(h, Math.round(GLITCH_BAND * s * (0.3 + glitchRand(42 + i * 2) * 0.7)));
        ctx.fillRect(x + dx, Math.round(y + glitchRand(43 + i * 2) * Math.max(0, h - bh)), w, bh);
    }
    ctx.globalAlpha = 1;
}

function glitchCrush(r, s) { // one band squashed into a shorter one, with white under it: a dropped scanline run
    var bh = Math.max(6, Math.min(r.h, GLITCH_BAND * s * (1.5 + glitchRand(50) * 1.5)));
    var by = Math.round(r.y + glitchRand(51) * Math.max(0, r.h - bh));
    var x = Math.round(r.x), w = Math.round(r.w);
    bh = Math.round(bh);
    var nh = Math.max(2, Math.round(bh * (0.35 + glitchRand(52) * 0.4)));
    if (w <= 0 || bh <= 0) {
        return;
    }
    ctx.drawImage(gameArea.canvas, x, by, w, bh, x, by, w, nh);
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(x, by + nh, w, bh - nh);
}

function menuGlitch(force) { // break a piece of the start screen for a moment
    if (gameStart || menuUp() || fxLook() != "full") {
        return; // not the start screen, or the player asked for less motion: this is the noisiest thing on it
    }
    glitchNo++; // every roll, fired or not, so two in a row are never the same damage
    if (force === undefined && glitchRand(1) > glitchChance()) { // kind 0 is a kind, not an absence of one
        return;
    }
    var f = layoutFrame();
    if (!(f.scale > 0)) {
        return; // a window with no size to speak of: nothing to copy from
    }
    drawStartScreen(); // clean first, so a clear that ran late can never let two of them pile up
    var targets = glitchTargets();
    var t = targets[Math.floor(glitchRand(2) * targets.length)];
    var r = { x: f.x + f.scale * t.x, y: f.y + f.scale * t.y, w: f.scale * t.w, h: f.scale * t.h };
    ctx.save();
    useWindow(); // a self-copy is in canvas pixels, whatever the layout was drawn at
    var kind = force === undefined ? Math.floor(glitchRand(3) * 3) : force;
    if (kind == 0) {
        glitchTear(r, f.scale);
    } else if (kind == 1) {
        glitchGhost(r, f.scale);
    } else {
        glitchCrush(r, f.scale);
    }
    ctx.restore();
    if (glitchClear) {
        clearTimeout(glitchClear);
    }
    glitchClear = setTimeout(function () { // whatever it broke, the next clean draw puts back
        glitchClear = null;
        if (!gameStart) {
            drawStartScreen();
        }
    }, GLITCH_HOLD);
}

// start screen animation, stopped when the game starts (same-delay timers run in creation order).
// This array is built while the script runs, so every delay in it has to be a value that already exists:
// GLITCH_EVERY was declared below this once, which made it undefined here, and setInterval read that as 0 --
// the glitches rolled 250 times a second instead of four and a half
const startScreenIntervals = [
    setInterval(updateSloganText, 3000),
    setInterval(focus_break_colors, 100),
    setInterval(click_to_start_colors, 50),
    setInterval(highlightControl, 100),
    setInterval(menuGlitch, GLITCH_EVERY), // and one that breaks a piece of it now and then
];

clearObjects();

function loadAudio() { // on the first click: start the album, each track playing the next, looping back to the first
    setMusicVolume(musicVolume);
    all_songs.forEach(function (song, i) {
        song.onended = function () { playSound(all_songs[(i + 1) % all_songs.length]); };
    });
    playSound(all_songs[0]);
}

function playSound(audio) { // play, ignoring failures such as blocked autoplay or a missing file
    var playing = audio.play();
    if (playing) { // older browsers (Chrome < 50, Firefox < 53) return nothing
        playing.catch(function () {});
    }
}

function setMusicRate(rate) { // playback rate for all songs
    all_songs.forEach(function (song) { song.playbackRate = rate; });
}

function setMusicVolume(volume) { // volume for all songs
    all_songs.forEach(function (song) { song.volume = volume; });
}

function layoutFrame() { // scale and offset that fit the LAYOUT_W x LAYOUT_H layout into the window, centered
    var scale = Math.min(gameArea.canvas.width / LAYOUT_W, gameArea.canvas.height / LAYOUT_H);
    return { scale: scale, x: (gameArea.canvas.width - LAYOUT_W * scale) / 2, y: (gameArea.canvas.height - LAYOUT_H * scale) / 2 };
}

function useLayout() { // draw in layout coordinates until useWindow()
    var f = layoutFrame();
    ctx.setTransform(f.scale, 0, 0, f.scale, f.x, f.y);
}

function useWindow() { // draw in window pixels (gameplay, banners)
    ctx.setTransform(1, 0, 0, 1, 0, 0);
}

// Most of the LAYOUT_W x LAYOUT_H frame is empty on every screen but the start screen, so fitting the whole of it into
// a phone shrinks the part that matters -- a 844x390 window was giving the messages 0.487 when they had room for
// nearly full size. A screen that only fills a band says how big that band is and gets that fitted instead. The cap is
// what fitting the whole frame would have given, so a window with room to spare is left exactly as it was.
var SCREEN_MARGIN = 0.075; // of the window kept clear around a band, so it never runs into the edges
var BANNER_REACH = 72; // how far in from each edge the stripes on a laid-out screen come (66), plus a little air:
                       // the fit always fills the room it is given, so a band that just cleared them looked stuck to them

function bandRoom() { // the width and height a band has, once the margins and the banner stripes are kept clear
    return { w: gameArea.canvas.width * (1 - 2 * SCREEN_MARGIN),
        // on a short window the stripes come further in than the margin does, and a band under one is unreadable
        h: gameArea.canvas.height - 2 * Math.max(SCREEN_MARGIN * gameArea.canvas.height, BANNER_REACH * bannerScale()) };
}

function fitBand(w, h) { // the scale a w x h band drawn around the middle of the layout gets on this window
    var room = bandRoom();
    return Math.min(Math.max(1, layoutFrame().scale), room.w / w, room.h / h);
}

function bandFrame(band) { // scale and offset that put a band, centred band.dy below the layout centre, on this window
    var s = fitBand(band.w, band.h);
    return { scale: s, x: (gameArea.canvas.width - LAYOUT_W * s) / 2,
        y: gameArea.canvas.height / 2 - s * (LAYOUT_H / 2 + band.dy) };
}

function useBand(band) { // layout coordinates again, with that band fitted in place of the whole frame
    var f = bandFrame(band);
    ctx.setTransform(f.scale, 0, 0, f.scale, f.x, f.y);
}

// the bands each of them fills, measured rather than guessed: the settings screen and the two pause panels
const OPTIONS_BAND = { w: 600, h: 540, dy: 24 };
const PAUSE_BAND = { w: 440, h: 160, dy: 10 };
const TOUCH_PAUSE_BAND = { w: 560, h: 240, dy: 0 };
const HELP_BAND = { w: 670, h: 500, dy: 34 }; // the larger of its two pages, measured; re-measure if they change
const PAUSE_HELP = { dx: -75, dy: 66, w: 150, h: 40 }; // the touch pause panel's way into the instructions

function pauseHelpAt(px, py) { // is this window point on that button? Only while the panel is actually up
    if (!pause || !alive || inputMode != "touch" || menuUp() || resumeTimer) {
        return false;
    }
    var f = bandFrame(TOUCH_PAUSE_BAND); // the frame the panel was drawn in, so the button is where it looks
    var bx = f.x + f.scale * (LAYOUT_W / 2 + PAUSE_HELP.dx);
    var by = f.y + f.scale * (LAYOUT_H / 2 + PAUSE_HELP.dy);
    return px >= bx && px <= bx + f.scale * PAUSE_HELP.w && py >= by && py <= by + f.scale * PAUSE_HELP.h;
}

function screenFrame() { // the frame the screen that is up was drawn in, so a click lands where its buttons are
    return menuScreen == "options" ? bandFrame(OPTIONS_BAND)
        : menuScreen == "help" ? bandFrame(HELP_BAND) : layoutFrame();
}

function useScreenFrame() { // draw in that same frame, so what is drawn and what is clicked agree
    var f = screenFrame();
    ctx.setTransform(f.scale, 0, 0, f.scale, f.x, f.y);
}

function hudScale() { // the in-game HUD keeps its size unless the window is too short or narrow for it
    // between the top banner (ends at 70px) and the level name (baseline 60px from the bottom) it needs 240px of
    // stats plus 30px of level name, and 600px across for the FOCUS/BREAK/DANGER text
    return Math.max(0.1, Math.min(1, (gameArea.canvas.height - 130) / 270, gameArea.canvas.width / 600));
}

function useHud() { // draw the top-left HUD, shrunk toward the top banner if needed
    var s = hudScale();
    ctx.setTransform(s, 0, 0, s, 0, 70 * (1 - s));
}

function buttonAt(px, py) { // name of the start-screen button at a window point, or ""
    var f = screenFrame();
    if (!(f.scale > 0)) {
        return "";
    }
    var lx = (px - f.x) / f.scale; // the point in layout coordinates
    var ly = (py - f.y) / f.scale;
    var table = buttonTable();
    for (var name in table) {
        var b = geom(name);
        if (!b) {
            continue; // not shown in this layout, so nothing to hit
        }
        var left = LAYOUT_W / 2 + b.dx;
        var top = LAYOUT_H / 2 + b.dy;
        if (lx > left && lx < left + b.w && ly > top && ly < top + (b.hitH || b.h)) {
            return name;
        }
    }
    return "";
}

function mouseMove(event) { // highlight the start-screen button under the mouse
    if (!gameStart) {
        var p = toGame(event.clientX, event.clientY);
        setHovered(buttonAt(p.x, p.y));
    }
}

function setHovered(name) { // highlight one start-screen button (or none)
    if (name != hoveredButton) { // only one button highlighted at a time
        drawStartScreen(); // erase the old highlight
        hoveredButton = name;
    }
}

function drawStartButtonText(b) { // the START button's label, in the current fill style
    var cx = LAYOUT_W / 2;
    var cy = LAYOUT_H / 2;
    if (startLayout() == "classic") {
        ctx.font = "25px Arial";
        ctx.fillText("CLICK TO START", cx - 400, cy);
        return;
    }
    ctx.save();
    ctx.textAlign = "center";
    ctx.font = "44px Arial";
    ctx.fillText("TAP TO START", cx + b.dx + b.w / 2, cy + b.dy + b.h * 0.45);
    ctx.font = "28px Arial";
    ctx.fillText("タップして開始", cx + b.dx + b.w / 2, cy + b.dy + b.h * 0.8);
    ctx.restore();
}

function drawControlLabel(name) { // a control button's label, in the current fill style
    var b = START_BUTTONS[name];
    var cx = LAYOUT_W / 2;
    var cy = LAYOUT_H / 2;
    if (startLayout() == "classic") {
        ctx.font = "40px Impact";
        ctx.fillText(b.label, cx + b.dx, cy + b.ty);
        return;
    }
    var g = geom(name);
    ctx.save();
    ctx.textAlign = "center";
    ctx.font = "48px Impact";
    ctx.fillText(b.touchLabel, cx + g.dx + g.w / 2, cy + g.dy + g.h / 2 + 17);
    ctx.restore();
}

function drawTitle(shadowColor, passes) { // FOCUS BREAK title: stacked shadow copies, then magenta on top
    ctx.font = "80px Arial";
    ctx.fillStyle = shadowColor;
    for (let count = 130 - passes; count < 130; count++){ // Bold effect
        ctx.fillText("FOCUS BREAK", count, count+80);
        ctx.fillText("焦点を絞る", count+100, count+180);
    }
    ctx.fillStyle = "#ff00ff";
    ctx.fillText("FOCUS BREAK", 130, 210);
    ctx.fillText("焦点を絞る", 230, 310);
}

function focus_break_colors(){ // Flashing colors on start screen
    if (menuUp()) {
        return; // a menu screen is up: these run on a timer and would paint the title over it
    }
    useLayout();
    drawTitle(getRandomColor(), 3);
    useWindow();
}

function click_to_start_colors(){ // Flashing colors on start screen
    if (menuUp()) {
        return;
    }
    if (hoveredButton == "start" || (inputMode == "touch" && !hoveredButton)) { // in touch play START always flashes
        var b = geom("start");
        ctx.globalAlpha = 0.35;
        ctx.fillStyle = getRandomColorGold();
        var i_x = getRandomInteger(-1, 1);
        var i_y = getRandomInteger(-1, 1);
        useLayout();
        ctx.fillRect(LAYOUT_W / 2 + b.dx + i_x, LAYOUT_H / 2 + b.dy + i_y, b.w + i_x, b.h + i_y);
        ctx.globalAlpha = 1.0;
        ctx.fillStyle = "black";
        drawStartButtonText(b);
        useWindow();
    }
}

function highlightControl() { // Flashing colors on the hovered control button (start screen)
    var b = buttonDef(hoveredButton);
    if (b && (b.setting || b.back)) { // a settings row carries a reading, so flash its edge instead of its label
        var s = geom(hoveredButton);
        var sx = LAYOUT_W / 2 + s.dx, sy = LAYOUT_H / 2 + s.dy;
        useScreenFrame(); // a menu row is fitted to its screen's band; the start screen's buttons are not
        ctx.globalAlpha = 0.9;
        ctx.fillStyle = getRandomColor();
        ctx.fillRect(sx, sy, s.w, 2);
        ctx.fillRect(sx, sy + s.h - 2, s.w, 2);
        ctx.fillRect(sx, sy, 2, s.h);
        ctx.fillRect(sx + s.w - 2, sy, 2, s.h);
        ctx.globalAlpha = 1.0;
        useWindow();
        return;
    }
    if (!b || !b.help) {
        return;
    }
    var g = geom(hoveredButton);
    useLayout();
    ctx.fillStyle = "#000000";
    ctx.fillRect(LAYOUT_W / 2 + g.dx, LAYOUT_H / 2 + g.dy, g.w, g.h);
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = getRandomColor();
    drawControlLabel(hoveredButton);
    ctx.globalAlpha = 1.0;
    useWindow();
}

function onLoad() {
    loadSettings(); // before anything is drawn, so the start screen opens on the settings that are in force
    loadRecords(); // and on whatever previous runs left behind
    gameArea.load();
    updateSloganText();
    playSound(aud_startup); // startup sound; browsers usually block it until the first click
}

const SLOGANS = ["TOO HARD", "Now in Color!", "Vegan!", "Siezure inducing!", "Advanced!", "Fresh!", "Spicy!", "Gotta Go Fast!",
    "Classic", "Coming Soon!", "4K 1080p", "Lite", "今は日本語です！", "Version 2", "Bug Free!", "Not Lame!", "...", "ULTRA", ""];

function updateSloganText() { // pick a random slogan and redraw the start screen
    sloganText = SLOGANS[Math.floor(Math.random() * SLOGANS.length)];
    drawStartScreen();
}

function copyCanvas() { // copy of what's on screen, or null if the canvas has no size
    if (gameArea.canvas.width == 0 || gameArea.canvas.height == 0) {
        return null;
    }
    var copy = document.createElement("canvas");
    copy.width = gameArea.canvas.width;
    copy.height = gameArea.canvas.height;
    copy.getContext("2d").drawImage(gameArea.canvas, 0, 0);
    return copy;
}

function windowResize() {
    var wasTall = gameArea.tall;
    var wasRotated = rotated;
    var moved = false; // the square had to be moved back on screen
    var dying = null;
    fxNextStop(); // the between-levels animation holds a frame at the old size; restFrame takes over from here
    if (die.on) { // a resize mid-shatter: the held frame is the wrong size now, so cut it short and let the message stand
        dying = die.then;
        fxDieStop();
        restFrame = null;
    }
    // resizing clears the canvas; keep what's shown between levels, e.g. a level transition message.
    // copy it once, before the first resize crops it, and reuse that copy for later resizes
    if (gameStart && !alive && !restFrame && !dying) {
        restFrame = copyCanvas();
    }
    gameArea.load();
    if (dying) { // draw it onto the newly sized canvas, and keep that as the frame later resizes redraw
        dying();
        restFrame = copyCanvas();
    } else if (alive) {
        if (inputMode == "touch") {
            if (wasTall != gameArea.tall || wasRotated != rotated) {
                setPause(true); // the device was turned: give the player a moment
            }
            // keep the square on the new screen (otherwise it would sweep back through obstacles it can't see) and steer from there
            var cx = gamePiece.x + gamePiece.width / 2;
            if (cx > gameArea.canvas.width) { // off the right edge: put it a little inside, not in the column where obstacles come in
                cx = gameArea.canvas.width - gamePiece.width / 2 - 40;
            }
            cx = Math.max(0, cx);
            var cy = Math.max(0, Math.min(gamePiece.y + gamePiece.height / 2, gameArea.canvas.height));
            moved = cx != gamePiece.x + gamePiece.width / 2 || cy != gamePiece.y + gamePiece.height / 2;
            gamePiece.x = cx - gamePiece.width / 2;
            gamePiece.y = cy - gamePiece.height / 2;
            gameArea.x = cx;
            gameArea.y = cy;
        }
        fitObstaclesToWindow();
        grazeDrop(); // the square may have been moved: it didn't fly whatever it is next to now
        if (moved) { // clear anything the square was moved onto: it couldn't be dodged (steering waits for the resume)
            obstacleLists().forEach(function (objects) {
                for (var i = objects.length - 1; i >= 0; i--) {
                    if (gamePiece.crashWith(objects[i])) {
                        objects.splice(i, 1);
                    }
                }
            });
        }
        if (pause) { // nothing redraws while paused, so draw the refitted level and the panel once
            stopResume(); // a resize stops a touch resume countdown: the panel asks for a tap again
            drawLevel();
            drawPauseScreen();
        }
    } else if (restFrame) {
        gameArea.context.drawImage(restFrame, 0, 0);
    }
    if (menuUp() || !gameStart) {
        drawStartScreen(); // which is whichever menu screen is up, if one is
    }
}

function drawStartScreen() { // draw the start screen, or whichever menu screen is standing in for it
    if (menuScreen == "options") {
        drawOptionsScreen();
        return;
    }
    if (menuScreen == "help") {
        drawHelpScreen();
        return;
    }
    var cx = LAYOUT_W / 2;
    var cy = LAYOUT_H / 2;

    // clear screen
    useWindow();
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, x, y);

    // Title
    useLayout();
    drawTitle("#00FFFF", 10);

    if (startLayout() == "classic") {
        // start button
        ctx.font = "25px Arial";
        ctx.globalAlpha = 0.2;
        ctx.fillStyle = "gray";
        var start = START_BUTTONS.start;
        ctx.fillRect(cx + start.dx, cy + start.dy, start.w, start.h);
        ctx.globalAlpha = 1.0;
        ctx.fillStyle = "black";
        ctx.fillText("CLICK TO START", cx - 400, cy);
        ctx.fillRect(cx - 450, cy + 25, 300, 2);
        ctx.fillText("クリックして開始", cx - 400, cy + 65);

        // controls: all boxes, then all labels
        var controls = [START_BUTTONS.break, START_BUTTONS.focus, START_BUTTONS.warp];
        ctx.fillStyle = "#00FFFF";
        controls.forEach(function (b) { ctx.fillRect(cx + b.dx, cy + b.dy, b.w, b.h); });
        ctx.font = "40px Impact";
        ctx.fillStyle = "#ff00ff";
        ctx.globalAlpha = 0.5;
        controls.forEach(function (b) { ctx.fillText(b.label, cx + b.dx, cy + b.ty); });
    } else {
        drawBigStartButtons();
    }

    // horizontal banners across the whole window
    useWindow();
    ctx.globalAlpha = 1.0;
    ctx.font = "40px Arial";
    ctx.fillStyle = "#00FFFF";
    var k = bannerScale();
    drawBanners(34, 30, k);
    ctx.fillStyle = "#ff00ff";
    drawBanners(40, 20, k);
    ctx.fillStyle = "black";
    ctx.globalAlpha = 0.7;
    ctx.fillRect(0, y - 40 * k, x, 2);
    ctx.fillRect(0, 60 * k, x, 2);

    // slogan
    useLayout();
    ctx.globalAlpha = 1.0;
    ctx.fillStyle = "#ff00ff";
    ctx.fillText(sloganText,sloganX,sloganY);
    if (sloganText == "Bug Free!"){
        for (let count = 1; count < 40; count++){ // Bold effect
            ctx.fillText("Bug Free!",sloganX-40+count,sloganY-40+count);
            ctx.fillStyle = getRandomColor();
        }
    }

    drawRecords();
    drawSettingButtons();
    useWindow();
}

function drawRecords() { // low on the start screen, under the start button; nothing at all before there is any
    var line = recordsLine();
    if (!line) {
        return; // a first run sees the screen the game has always opened on
    }
    var classic = startLayout() == "classic";
    ctx.globalAlpha = 1.0;
    ctx.font = (classic ? "24px" : "30px") + " Arial";
    ctx.fillStyle = "#ff00ff"; // 3.14:1 on the screen's white, and the colour the title and slogan already use
    ctx.fillText(line, classic ? 240 : 190, classic ? 575 : 690); // under the difficulty button, whose best it is
}

function drawSettingButtons() { // the start screen's two menu buttons: the run's difficulty, and the settings
    var classic = startLayout() == "classic";
    ctx.globalAlpha = 1.0;
    ctx.textAlign = "center";
    [["difficulty", mode().label], ["options", "OPTIONS 設定"], ["help", "HELP 説明"]].forEach(function (b) {
        var g = geom(b[0]);
        if (!g) {
            return;
        }
        var x = LAYOUT_W / 2 + g.dx, y = LAYOUT_H / 2 + g.dy;
        ctx.font = (classic ? "22px" : "34px") + " Arial";
        ctx.fillStyle = "#00FFFF";
        ctx.fillRect(x, y, g.w, g.h);
        ctx.fillStyle = "black";
        ctx.fillRect(x + 2, y + 2, g.w - 4, g.h - 4);
        ctx.fillStyle = "#ff00ff";
        ctx.fillText(b[1], x + g.w / 2, y + g.h / 2 + (classic ? 8 : 12), g.w - 16);
    });
    ctx.textAlign = "start"; // the rest of the screen draws left-aligned
}

function drawOptionsScreen() { // the settings, on a screen of their own
    var cx = LAYOUT_W / 2, cy = LAYOUT_H / 2;
    useWindow();
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, x, y);

    useScreenFrame(); // a menu of rows to read and tap, so it is sized for the screen rather than for the frame
    ctx.globalAlpha = 1.0;
    ctx.textAlign = "center";
    ctx.font = "70px Arial";
    ctx.fillStyle = "#00FFFF"; // the title printed twice, as everything in this game is
    ctx.fillText("OPTIONS", cx - 4, cy - 196);
    ctx.fillStyle = "#ff00ff";
    ctx.fillText("OPTIONS", cx, cy - 192);
    ctx.font = "28px Arial";
    ctx.fillStyle = "black";
    ctx.fillText("設定", cx, cy - 158);

    for (var name in OPTION_BUTTONS) {
        var b = OPTION_BUTTONS[name];
        var bx = cx + b.dx, by = cy + b.dy;
        ctx.fillStyle = "#00FFFF";
        ctx.fillRect(bx, by, b.w, b.h);
        ctx.fillStyle = "black";
        ctx.fillRect(bx + 2, by + 2, b.w - 4, b.h - 4);
        ctx.fillStyle = "#ff00ff";
        ctx.font = (b.back ? "36px" : "30px") + " Arial";
        ctx.fillText(b.back ? b.label : SETTINGS[b.setting].read(), bx + b.w / 2, by + b.h / 2 + 10, b.w - 20);
    }

    ctx.font = "20px Arial"; // neither touch setting does anything under a mouse, and the menu is where you look
    ctx.fillStyle = "black";
    ctx.fillText("Steering: how far the square moves per pixel of finger", cx, cy + 142);
    ctx.fillText("Buttons: which side they sit on. Both are touch only", cx, cy + 166);
    ctx.fillText(inputMode == "touch" ? "Tap BACK to return" : "Click BACK, or press Escape, to return", cx, cy + 290);
    ctx.textAlign = "start";

    useWindow(); // the same stripes the start screen wears, so this reads as part of it
    ctx.font = "40px Arial";
    var k = bannerScale();
    ctx.fillStyle = "#00FFFF";
    drawBanners(34, 30, k);
    ctx.fillStyle = "#ff00ff";
    drawBanners(40, 20, k);
}

// The instructions. Two pages, because one screen holding all of it would have to shrink to fit a phone and the whole
// point is that it can be read. Reachable from the start screen and from pause, and it paints its own background, so
// it works over the menu and over a frozen level alike.
var helpPage = 0;

const HELP_BUTTONS = {
    help_next: { dx: -310, dy: 186, w: 280, h: 66, page: true, label: "NEXT 次へ" },
    help_back: { dx: 30, dy: 186, w: 280, h: 66, back: true, label: "BACK" },
};

function helpLines() { // the page now showing: a heading is a line of its own, and the line under it says what it does
    var touch = inputMode == "touch";
    if (helpPage === 0) {
        return [
            { t: "CONTROLS 操作", title: true },
            { t: touch ? "Drag anywhere to steer" : "The square follows your cursor" },
            { t: touch ? "HOLD FOCUS" : "SHIFT or LEFT CLICK  -  FOCUS", head: true },
            { t: "time slows, your hitbox shrinks, and the score stops" },
            { t: touch ? "HOLD WARP" : "CTRL or RIGHT CLICK  -  WARP", head: true },
            { t: "time speeds up and the score doubles" },
            { t: touch ? "TAP BREAK" : "SPACE or MIDDLE CLICK  -  BREAK", head: true },
            { t: "two seconds where nothing can touch you, for 250 score" },
            { t: touch ? "The pause icon is in the top " + (TOUCH_SIDE == "left" ? "left" : "right") + " corner"
                : "P pauses.  R plays again from the finish screen." },
        ];
    }
    return [
        { t: "SCORING 得点", title: true },
        { t: "Reach 1000 to clear a level. There are fifteen of them." },
        { t: "GRAZE", head: true },
        { t: "pass close to an obstacle without touching it, and the" },
        { t: "closer the pass, the more charge it banks" },
        { t: "CHARGES", head: true },
        { t: "each one you hold adds 25% to your score rate" },
        { t: "a Break spends one instead of costing 250 score" },
        { t: "Focus burns one to keep scoring while it is slowed" },
        { t: "Gold pickups are worth 50. The other kind is a free Break." },
    ];
}

function drawHelpScreen() { // over the start screen, or over a level that is paused: either way it paints its own white
    useWindow();
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, x, y);

    useScreenFrame();
    ctx.globalAlpha = 1.0;
    ctx.textAlign = "center";
    var cx = LAYOUT_W / 2, cy = LAYOUT_H / 2;
    var dy = -176;
    helpLines().forEach(function (line) {
        if (line.title) {
            ctx.font = "46px Arial";
            ctx.fillStyle = "#00FFFF"; // the title printed twice, as everything in this game is
            ctx.fillText(line.t, cx - 3, cy + dy + 3);
            ctx.fillStyle = "#ff00ff";
            ctx.fillText(line.t, cx, cy + dy);
            dy += 62;
            return;
        }
        ctx.font = (line.head ? "bold 28px" : "26px") + " Arial";
        ctx.fillStyle = line.head ? "#ff00ff" : "black";
        ctx.fillText(line.t, cx, cy + dy);
        dy += line.head ? 40 : 36;
    });

    for (var name in HELP_BUTTONS) {
        var b = HELP_BUTTONS[name];
        var bx = cx + b.dx, by = cy + b.dy;
        ctx.fillStyle = "#00FFFF";
        ctx.fillRect(bx, by, b.w, b.h);
        ctx.fillStyle = "black";
        ctx.fillRect(bx + 2, by + 2, b.w - 4, b.h - 4);
        ctx.fillStyle = "#ff00ff";
        ctx.font = "32px Arial";
        ctx.fillText(b.label, bx + b.w / 2, by + b.h / 2 + 11, b.w - 20);
    }
    ctx.font = "20px Arial";
    ctx.fillStyle = "black";
    ctx.fillText((helpPage + 1) + " / 2", cx, cy + 282);
    ctx.textAlign = "start";

    useWindow(); // the same stripes the start and settings screens wear, so the three read as one set
    var k = bannerScale();
    ctx.fillStyle = "#00FFFF";
    drawBanners(34, 30, k);
    ctx.fillStyle = "#ff00ff";
    drawBanners(40, 20, k);
}

function helpPress(name) { // a press on the instructions: turn the page, or leave
    var b = HELP_BUTTONS[name];
    if (!b) {
        return;
    }
    playSound(aud_click);
    if (b.back) {
        closeMenu();
    } else {
        helpPage = (helpPage + 1) % 2;
        drawHelpScreen();
    }
}

function openMenu(name) { // put a menu screen up, over the start screen or over a level that is paused
    hoveredButton = ""; // set directly: setHovered would redraw the screen being left or entered, twice
    menuScreen = name;
    playSound(aud_click);
    drawStartScreen();
}

function closeMenu() { // and put back whatever it was covering
    hoveredButton = "";
    menuScreen = "";
    playSound(aud_click);
    if (gameStart) {
        stopResume(); // a countdown can't have been running under it, but a tap may have started one since
        drawLevel();
        drawPauseScreen();
    } else {
        drawStartScreen();
    }
}

function optionsPress(name) { // a press on the settings screen: cycle a row, or go back. Anything else is ignored
    var b = OPTION_BUTTONS[name];
    if (!b) {
        return;
    }
    if (b.back) {
        closeMenu();
    } else {
        cycleSetting(b.setting);
    }
}

function menuPress(name) { // a press while a menu screen is up, whichever one it is
    if (menuScreen == "options") {
        optionsPress(name);
    } else if (menuScreen == "help") {
        helpPress(name);
    }
}

function drawBigStartButtons() { // the start screen's START and control buttons in the bigger touch layout
    var cx = LAYOUT_W / 2;
    var cy = LAYOUT_H / 2;
    var start = geom("start");
    ctx.globalAlpha = 0.2;
    ctx.fillStyle = "gray";
    ctx.fillRect(cx + start.dx, cy + start.dy, start.w, start.h);
    ctx.globalAlpha = 1.0;
    ctx.fillStyle = "black";
    drawStartButtonText(start);
    var names = ["break", "focus", "warp"];
    ctx.fillStyle = "#00FFFF";
    names.forEach(function (name) { var g = geom(name); ctx.fillRect(cx + g.dx, cy + g.dy, g.w, g.h); });
    ctx.fillStyle = "#ff00ff";
    ctx.globalAlpha = 0.5;
    names.forEach(drawControlLabel);
    ctx.globalAlpha = 1.0;
    ctx.fillStyle = "black";
    ctx.font = "28px Arial";
    ctx.fillText("Drag anywhere to steer", 190, 640);
}

function startGame(e) {
    if (!gameStart) { // first start
        startScreenIntervals.forEach(function (id) { clearInterval(id); });
        loadAudio();
        playSound(aud_click);
        startTime = Date.now();
        startRunRations(); // the difficulty is locked in from here: its button only lives on the start screen
        var size = pieceSize();
        gamePiece = new component(size, size, gamePieceColor, e.pageX - size / 2, e.pageY - size / 2); // centered on the cursor
    }
    gameArea.start();
    gameStart = true;
    alive = true;
    startLevelRations(); // a level gets its powers back, whether it was cleared or died on
    levelStart = Date.now(); // the split clock; startTime keeps running across the whole run
    levelBeat = 0;
    reachedLevel(level);
    restFrame = null; // the next transition screen gets a fresh copy
    pause = false;
    var cx = gamePiece.x + gamePiece.width / 2;
    var cy = gamePiece.y + gamePiece.height / 2;
    if (inputMode == "touch" && (cx < 0 || cy < 0 || cx > gameArea.canvas.width || cy > gameArea.canvas.height)) {
        // the window shrank between levels: back to the touch start spot (the level starts empty)
        gameArea.x = gameArea.canvas.width * 0.25;
        gameArea.y = gameArea.canvas.height * 0.5;
        gamePiece.x = gameArea.x - gamePiece.width / 2;
        gamePiece.y = gameArea.y - gamePiece.height / 2;
    }
    if (!document.hasFocus()) { // player left during the level transition; wait for them
        setPause(true);
    }
    applyHeldSpeed(); // pick up a power held through the level transition (does nothing while paused)
}

function startTouchGame() { // start from a tap: the square starts at the left middle, and sounds are unlocked in this tap
    [aud_bomb, aud_menuSound, aud_death, aud_danger, aud_powerUp, aud_pickupCoin].forEach(function (sound) {
        // mobile browsers only let a sound play later if it was first played during a tap; pausing at once keeps it silent
        // (a later reset, once play() settles, could stop the sound's first real use on a slow connection)
        var playing = sound.play();
        sound.pause();
        if (playing) {
            playing.catch(function () {}); // pausing before playback starts rejects play()
        }
    });
    var startX = gameArea.canvas.width * 0.25;
    var tb = touchButtons();
    if (tb.side == "left") { // that quarter is where the buttons are now: start clear of them, no further
        startX = Math.max(startX, tb.box.right + 40);
    }
    var startY = gameArea.canvas.height * 0.5;
    startGame({ pageX: startX, pageY: startY });
    gameArea.x = startX; // the steering target starts on the square
    gameArea.y = startY;
}

var nextWait = 0; // how long the screen just put up is going to stay, so the transition can play for exactly that

function wait(time) {
    nextWait = time;
    setTimeout(startNextLevel, time);
}

function restartRun() { // after the finish screen, start a fresh run from level 1
    runFinished = false;
    restartArmed = false;
    level = 1;
    deaths = 0;
    perfectClear = 0; // the hitbox shrink is earned again each run
    score = 0;
    grazeClear();
    startRunRations();
    scoreLimitReached = false;
    startTime = Date.now();
    setPieceSize(pieceSize());
    startNextLevel();
}

function startNextLevel() {
    gameArea.clear();
    startGame();
}

// The death and between-levels messages used to be laid out inside the same 1280x800 frame as the start screen and
// scaled with it. A phone therefore had to fit 800px of height the messages never use -- they only ever fill a band
// about 865 by 337 in the middle of that frame -- and showed them at 0.487 when there was room for nearly full size.
// The lines were centred by eye too, which left the finish screen sitting 134px to the left of the middle.
// A message is now collected line by line, measured, and drawn as one block: every line truly centred, the block
// centred on the screen, and the whole thing scaled to fill it. It is the one band that has to be measured at draw
// time rather than written down, because the lines it holds depend on the level, the score and the deaths.
var msgBlock = []; // the lines queued so far, measured and drawn by showMessage

function centerText(text, dy, passes) { // queue a line dy from the block's baseline, in the font and fill set now;
    // passes > 1 repeats it 1px down and right for a bold look
    msgBlock.push({ text: text, dy: dy, passes: passes || 1, font: ctx.font, fill: ctx.fillStyle });
}

function msgBottom() { // the lowest line queued so far, so another can be put under whatever a branch put up
    var low = 0;
    for (let i = 0; i < msgBlock.length; i++) {
        low = Math.max(low, msgBlock[i].dy);
    }
    return low;
}

function showSplit() { // the level's time under the message, and what it was before, on every cleared screen
    if (levelBeat <= 0) {
        return; // nothing timed: a level that was never played can't have a split
    }
    var best = rec().level[level - 1]; // recordLevel has already taken it, and level has already moved on
    ctx.font = "30px Arial";
    ctx.fillStyle = levelRecord ? "#48D1CC" : "black";
    centerText(splitText(levelBeat) + (levelRecord ? "   NEW BEST" : "   best " + splitText(best)),
        msgBottom() + 80);
}

function showMessage() { // draw the queued lines centred and as large as this screen allows, and return that scale
    if (!msgBlock.length) {
        return 1;
    }
    var left = Infinity, right = -Infinity, top = Infinity, bottom = -Infinity;
    for (let i = 0; i < msgBlock.length; i++) {
        var line = msgBlock[i];
        ctx.font = line.font;
        var m = ctx.measureText(line.text);
        left = Math.min(left, -m.width / 2);
        right = Math.max(right, m.width / 2 + line.passes - 1); // the bold passes reach 1px further for each repeat
        top = Math.min(top, line.dy - m.actualBoundingBoxAscent);
        bottom = Math.max(bottom, line.dy + m.actualBoundingBoxDescent + line.passes - 1);
    }
    var s = fitBand(right - left, bottom - top);
    var dx = -(left + right) / 2;
    var dy = -(top + bottom) / 2; // the lines sit mostly above their baseline, so the block has to come down to the middle
    ctx.setTransform(s, 0, 0, s, gameArea.canvas.width / 2, gameArea.canvas.height / 2);
    ctx.textAlign = "center";
    for (let i = 0; i < msgBlock.length; i++) {
        var l = msgBlock[i];
        ctx.font = l.font;
        ctx.fillStyle = l.fill;
        for (let p = 0; p < l.passes; p++) {
            ctx.fillText(l.text, dx + p, l.dy + dy + p);
        }
    }
    ctx.textAlign = "start"; // the rest of the game draws left-aligned text
    msgBlock.length = 0;
    return s;
}

function gameOver() { // the level was cleared or the player died
    alive = false;
    endBreak(); // a level can end mid-break
    resumeSpeed(); // which also puts the music's rate back, whatever power the level ended under
    gameArea.stop();
    var levelCleared = score >= scoreLimit || scoreLimitReached;
    scoreLimitReached = false;
    var shattering = false;
    lifeSpent = false;
    if (!levelCleared) { // before the clear and before the obstacles go: the shatter needs the frame and what was hit.
        // If it starts, it plays over the held frame and draws the message itself when it finishes
        var died = score;
        shattering = fxDieStart(function () { drawDeathMessage(died); });
    }
    gameArea.clear();
    clearObjects();
    fxReset(); // the screen is cleared for the message: nothing of the effects carries over (die is deliberately not fx)
    ctx.font = "60px Arial";
    ctx.fillStyle = "red";
    gameArea.canvas.style.cursor = "default";
    if (levelCleared) { // Next level
        recordLevel(level); // the split for the one just flown, before level moves on
        level++;
        if (level == 16){ // true finish
            var runMs = Date.now() - startTime;
            var runBest = recordRun(runMs, deaths);
            centerText("Time: " + millisToMinutesAndSeconds(runMs), 0);
            if (deaths == 0){
                centerText("Flawless Victory", -175);
            } else {
                centerText("Can you continue?", -175);
                centerText(deaths + " mistakes", -87);
            }
            ctx.font = "30px Arial";
            ctx.fillStyle = runBest ? "#48D1CC" : "black";
            centerText(runBest ? "NEW BEST" : "best " + millisToMinutesAndSeconds(rec().run)
                + "   " + mistakes(rec().runDeaths), 45);
            ctx.fillStyle = "black";
            if (inputMode == "touch") {
                ctx.font = "40px Arial";
                centerText("Tap to play again", 100);
            } else {
                ctx.font = "30px Arial";
                centerText("Click or press R to play again", 100);
            }
            showMessage();
            runFinished = true;
            finishTime = Date.now();
            restartArmed = false; // a click already in progress (e.g. held for Focus) shouldn't restart
            useWindow();
            return;
        } else if (level == 10){ // you win
            ctx.fillStyle = "Black";
            centerText("Victory is a state of mind", -175);
            centerText("勝利は心の状態です", -75);
            showSplit();
            showMessage();
            drawBanners(40, 20, bannerScale());
            wait(5000);
        } else if (level == 9){
            playSound(aud_bomb); // over the album rather than in place of it: the siren is the louder of the two
            ctx.font = "80px Arial";
            centerText("WARNING 警告", -175, 3);
            centerText("多数の敵が接近する", -75, 3);
            showSplit();
            showMessage();
            drawBanners(40, 30, bannerScale());
            wait(3500);
        } else if (deaths == 0) { // perfect clear
            playSound(aud_menuSound);
            ctx.fillStyle = "#48D1CC";
            if (perfectClear < 7){ // decrease hitbox size
                perfectClear++;
                centerText("Hitbox size decreased!", -75);
                centerText("ヒットボックスを減らす!", 50);
            }
            centerText("+ Perfect 完全 +", -175, 3);
            showSplit();
            showMessage();
            drawBanners(40, 20, bannerScale());
            wait(3000);
        } else { // normal clear
            centerText("Enemies Approaching", -175);
            centerText("非常に大きな敵に接近する危険!", -50);
            centerText("慎重に進んでください!", 25);
            showSplit();
            showMessage();
            wait(3000);
        }
        useWindow(); // the message is down: hold it and play the transition under and over it
        fxNextStart(nextWait);
    } else { // you lose
        deaths += 1;
        lifeSpent = runLives > 0;
        if (lifeSpent) { // a life buys the level's progress back: the death reads as a transition, not a reset
            runLives--;
            grazeLevel(); // and the graze bank comes with it, as it does between levels
        } else {
            grazeClear(); // the level starts again from nothing, the graze bank with it
        }
        playSound(aud_death);
        if (!shattering) { // with the shatter running, this is drawn when it finishes instead
            drawDeathMessage(score);
        }
        wait(2500);
    }
    useWindow();
    if (!lifeSpent) {
        score = 0; // a cleared level starts the next one at nothing; a life is what keeps a death from doing it
    }
}

function drawDeathMessage(shown) { // the message after a death. Takes the score because with the shatter running it is
    // drawn after gameOver has already reset it
    ctx.font = "60px Arial";
    ctx.fillStyle = "red";
    centerText("Score: " + shown, -75);
    var deathSlogan = { 69: "😂", 420: "blaze it", 666: "😈", 911: "TOO SOON", 999: "TOO HARD" }[shown]; // special scores
    var sloganRow = 25; // the row under the score, which only the ordinary scores have anything in
    if (shown >= 900) {
        centerText("So Close", -175);
    } else if (shown <= 100) {
        centerText("...", -175);
    } else {
        centerText("Try Again", -175);
        centerText("再試行する", 25);
        sloganRow = 125; // taken: centred, the slogan would land straight on top of it instead of beside it
    }
    if (deathSlogan) {
        centerText(deathSlogan, sloganRow);
    }
    if (lifeSpent) {
        ctx.font = "30px Arial";
        ctx.fillStyle = "#48D1CC";
        centerText("LIFE SPENT   score kept   " + runLives + " left", msgBottom() + 80);
    }
    showMessage();
    useWindow();
}

function resizeAroundCenter(obj, size) { // make obj a size x size square with the same center
    obj.x -= (size - obj.width) / 2;
    obj.y -= (size - obj.height) / 2;
    obj.width = size;
    obj.height = size;
}

function setPieceSize(size) { // gamePiece's center sits on the cursor
    resizeAroundCenter(gamePiece, size);
}

function pieceSize() { // hitbox size: smaller during Focus or Warp, and 1px smaller for each flawless level
    return (focused ? 15 : 20) - perfectClear;
}

function setMode(isFocused, newSpeed, musicRate) { // normal speed, Focus or Warp
    focused = isFocused;
    if (alive) {
        setPieceSize(pieceSize());
    }
    speed = newSpeed;
    setMusicRate(musicRate);
}

function addScore(points) { // score for staying alive, at whatever rate the banked graze charges are worth.
    // With nothing banked the rate is 1 and the bank stays empty, so this is the bare score++ it replaced
    scoreBank += points * grazeRate();
    var whole = Math.floor(scoreBank);
    scoreBank -= whole;
    score += whole;
}

function resumeSpeed() { setMode(false, 1, 1.0); }
function setSlowSpeed() { setMode(true, speed_slow, 0.75); } // FOCUS
function setFastSpeed() { setMode(true, speed_fast, 1.2); } // WARP

// The graze system. The square is grazing whenever an obstacle comes within GRAZE_PX of one of its sides without
// touching it, and the closer the pass the more it counts. The measurement used to live in the effects, where it only
// fed the sparks; it is game state now, because it pays -- the effects are switchable and must never change what the
// game does, so anything that scores has to be on this side of the line. The sparks read it, as they read everything.
//
// A pass banks charge for how close it got: hold charges and the score rate climbs, spend one and a Break is free
// instead of costing 250. That is the whole loop -- flying tight is worth something, and cashing it in costs you the
// rate you built. Before this a graze was purely decorative and Warp's double rate was the only scoring lever.
var GRAZE_PX = 10; // how close, per axis, counts as a graze; also the farthest the world moves in a step (hyper in Warp)
const GRAZE_RAMP = { full: GRAZE_PX }; // reads a gap as 0..1 through fxEase, so closeness eases like every fade
var GRAZE_GAIN = 0.4; // charge for a pass with no gap left at all; a pass pays gain * closeness squared, so a 2px
                      // pass is worth three 5px ones and seventy 8px ones. Flying tight has to beat flying near
var GRAZE_MAX = 3; // charges held at once: past this a pass still lights the square, it just has nowhere to bank
var GRAZE_CLEAR = 10; // steps a side must be clear before the next thing along it counts as a new pass and pays again
var GRAZE_BOOST = 0.25; // score rate added per charge held: three charges is +75%, and a Break is what spends them
var GRAZE_LIT = 30; // steps a charge landing or leaving keeps the meter marked, so it isn't missed mid-dodge
// Focus slows time, shrinks the hitbox and scores nothing: it stops the clock on the level's progress, and that
// is its price. A banked charge pays that price instead, and the level keeps moving while the world crawls --
// which is the one thing the charges can be spent on deliberately, rather than by pressing Break in a panic.
// The premium is the rate: holding a charge for a whole level saves about four seconds, burning one buys about
// two, and the two seconds it buys are flown at a quarter of the danger. Safety costs progress.
var GRAZE_BURN = 300; // steps of scoring Focus one charge buys: three seconds
var GRAZE_BURN_EVERY = 4; // and it scores every fourth step: half what the same time at normal speed pays

var graze = {
    charges: 0, // whole charges banked
    fill: 0, // progress toward the next one, 0..1
    lit: GRAZE_LIT, // steps since one landed, for the meter's mark
    free: false, // a charge paid for the Break that is running
    burn: 0, // how much of the top charge Focus has eaten, 0..1
    burning: false, // and whether it is eating it this step, so the meter and the score can say so
    side: [], // this step's closest pass per side (0 top, 1 right, 2 bottom, 3 left), so the scan allocates nothing
};
while (graze.side.length < 4) {
    graze.side.push({ power: 0, x: 0, y: 0, v: 0, peak: 0, clear: GRAZE_CLEAR });
}

function grazeDrop() { // no pass in progress: the next thing along a side starts a fresh one and pays again
    for (var i = 0; i < 4; i++) {
        var s = graze.side[i];
        s.power = s.peak = 0;
        s.clear = GRAZE_CLEAR;
    }
}

function grazeLevel() { // a level begins: no pass is in progress and the fraction of a point doesn't carry, but
    // the charges do. They were earned by flying tight and the next level is where they are worth spending
    graze.free = false;
    scoreBank = 0;
    grazeDrop();
}

function grazeClear() { // a death or a fresh run: the bank goes the same way the score does
    graze.charges = 0;
    graze.fill = 0;
    graze.burn = 0;
    graze.lit = GRAZE_LIT;
    grazeLevel();
}

function grazeRate() { // what the banked charges are worth: the multiplier on the score for staying alive
    return 1 + GRAZE_BOOST * graze.charges;
}

function grazeBurn() { // Focus with something banked: the charge pays for the slowed time, and drains for it
    if (invincible || speed != speed_slow || graze.charges <= 0) {
        return false; // nothing to spend, nothing slowed to spend it on, or a Break is already paying
    }
    graze.burn += 1 / GRAZE_BURN;
    if (graze.burn >= 1) { // that one is gone; the next Focus starts on the one under it
        graze.burn = 0;
        graze.charges--;
        graze.lit = 0;
    }
    return true;
}

function grazeEarn(amount) { // bank a pass, carrying whole charges out of the meter
    if (graze.charges >= GRAZE_MAX) {
        return; // nowhere to put it: spend one, or the pass is only a spark
    }
    graze.fill += amount;
    while (graze.fill >= 1) {
        graze.fill -= 1;
        graze.charges++;
        graze.lit = 0;
        playSound(aud_menuSound);
        if (graze.charges >= GRAZE_MAX) {
            graze.fill = 0; // full: the overflow is lost rather than sitting there waiting for a spend
            break;
        }
    }
}

function grazeBank(side) { // one side's pass: pay for how much closer it got than it has already been paid for
    var s = graze.side[side];
    if (s.power <= 0) {
        s.clear++;
        if (s.clear >= GRAZE_CLEAR) {
            s.peak = 0; // clear for long enough that whatever comes next is a new pass
        }
        return;
    }
    s.clear = 0;
    if (s.power > s.peak) { // only the tightening is new, so one pass pays gain * its closest moment, once
        grazeEarn(GRAZE_GAIN * (s.power * s.power - s.peak * s.peak));
        s.peak = s.power;
    }
}

function grazeConsider(side, power, x, y, v) { // this step's closest pass on each side wins the slot
    var c = graze.side[side];
    if (power > c.power) {
        c.power = power;
        c.x = x;
        c.y = y;
        c.v = v;
    }
}

function grazeHidden(x1, x2) { // does this span sit inside a level 13/14 bar, where a block of the bar's color is
    // camouflaged? The sparks don't outline what the level is hiding, and a pass the player couldn't see doesn't pay
    if (level != 13 && level != 14) {
        return false;
    }
    var w = gameArea.canvas.width / 1920; // the bars' own units, from drawLevelName
    if (x1 >= 900 * w && x2 <= 1000 * w) {
        return true;
    }
    return level == 14 && x1 >= 1100 * w;
}

function grazeStep() { // each step, after everything has moved: how close did the square just come to anything, and
    // what has that earned. This is the one moment the gaps are the ones the player actually flew
    var i;
    graze.lit = Math.min(graze.lit + 1, GRAZE_LIT);
    graze.burning = grazeBurn(); // before drawStats reads it, further down the same step
    for (i = 0; i < 4; i++) {
        graze.side[i].power = 0;
    }
    if (invincible) { // Break: movePiece skips collisions, so obstacles sit on the square all through it
        grazeDrop();
        return;
    }
    var left = gamePiece.x, top = gamePiece.y;
    var right = left + gamePiece.width, bottom = top + gamePiece.height;
    var W = gameArea.canvas.width, H = gameArea.canvas.height;
    for (var lane in OBSTACLE_SPEEDS) {
        var objects = obstacles[lane], v = OBSTACLE_SPEEDS[lane];
        for (var k = 0; k < objects.length; k++) {
            var o = objects[k];
            if (o.width <= 0 || o.height <= 0) {
                continue; // nothing drawn, so nothing to pass close to (as crashWith's own guard has it)
            }
            if (o.x >= W || o.x + o.width <= 0 || o.y >= H || o.y + o.height <= 0) {
                continue; // off screen: if the player can't see it, they didn't dodge it
            }
            var gx = Math.max(o.x - right, left - (o.x + o.width)); // the gap per axis, the quantity crashWith splits on
            if (gx >= GRAZE_PX) {
                continue; // one subtract and a compare turn away almost everything
            }
            var gy = Math.max(o.y - bottom, top - (o.y + o.height));
            if (gy >= GRAZE_PX) {
                continue;
            }
            var sep = Math.max(gx, gy);
            if (sep <= 0) {
                continue; // touching is a hit, not a graze
            }
            if (grazeHidden(o.x, o.x + o.width)) {
                continue; // levels 13 and 14: what the level is hiding neither lights up nor pays
            }
            var p = fxEase(GRAZE_PX - sep, GRAZE_RAMP); // fxEase is the file's smoothstep, not an effect
            var px = Math.max(gx, 0), py = Math.max(gy, 0);
            var share = px / (px + py); // at a corner the pass belongs to both sides, in proportion
            if (share > 0) { // a vertical side: the shared extent runs along y
                var lo = Math.max(top, o.y), hi = Math.min(bottom, o.y + o.height);
                var my = hi >= lo ? (lo + hi) / 2 : (o.y > bottom ? bottom : top);
                grazeConsider(o.x > left ? 1 : 3, p * share, o.x > left ? right : left, my, v);
            }
            if (share < 1) { // a horizontal side: the shared extent runs along x
                var lx = Math.max(left, o.x), hx = Math.min(right, o.x + o.width);
                var mx = hx >= lx ? (lx + hx) / 2 : (o.x > right ? right : left);
                grazeConsider(o.y > top ? 2 : 0, p * (1 - share), mx, o.y > top ? bottom : top, v);
            }
        }
    }
    for (i = 0; i < 4; i++) {
        grazeBank(i);
    }
}

function setBreak(penalty){
    if (!invincible) {
        powerups.break = []; // destroy powerups on break
        powerups.score = [];
        invincible = true;
        if (graze.charges > 0) { // a banked charge pays for it instead of the score -- and the rate goes down with it,
            graze.charges--; // so the choice is a Break now against a faster score for the rest of the level
            graze.free = true;
        } else {
            score += -penalty;
        }

    }

// power inputs currently held down, so releasing one can fall back to another (tfocus/twarp: the touch buttons)
var held = { shift: false, ctrl: false, lmb: false, rmb: false, tfocus: false, twarp: false };

// Input: the mouse (with keyboard) or touch. inputMode follows the last real input and picks the labels and controls.
var inputMode = (window.matchMedia && window.matchMedia("(pointer: coarse)").matches) ? "touch" : "mouse";
var lastTouchTime = 0; // when the last touch event arrived; mouse events a browser makes up after a touch are ignored
var activeTouches = 0; // fingers down
var TOUCH_GAIN = 1.25; // touch steering: the square moves 1.25px for each px the steering finger moves

function canAct() { // powers only work while playing and unpaused

}

function setPause(paused) { // pause or resume play; only while alive

        drawPauseScreen();
        return;
    }
    if (!alive || paused == pause) {
        return;
    }
    cancelResume();
    pause = paused;
    gameArea.canvas.style.cursor = pause ? "default" : "none"; // let the player line the cursor back up with their square
    if (pause) {
        pauseStart = Date.now();

        // mid-way. Only the rate goes back to normal, because a track left pitched down by Focus or up by Warp
        // would drone at that speed for as long as the pause lasts. applyHeldSpeed puts it back on the way out
        setMusicRate(1.0);

function releaseAll() { // the player went away (window blur, app switch, a system gesture): let go of everything and pause
    held.shift = held.ctrl = held.lmb = held.rmb = held.tfocus = held.twarp = false;
    touch.roles = {};
    touch.steerId = null;
    applyHeldSpeed();

function cancelResume() { // stop a touch resume countdown

}

function stopResume() { // a touch resume countdown was cut short: stay paused and wait for a new tap

function startResumeCountdown() { // touch resume: 3, 2, 1 (400ms each), so the player can put their thumbs down first

    }
