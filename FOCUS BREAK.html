<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; } /* canvas fills the window so page and canvas coordinates match */
        canvas { display: block; }
    </style>
</head>
<body onload="onLoad()" onresize="windowResize()" oncontextmenu="return false;">
    <audio id="audio01" src="music/Cavalier - Vol. 8 - 01 Before U Go.mp3"></audio>
    <audio id="audio02" src="music/Cavalier - Vol. 8 - 02 Reflex.mp3"></audio>
    <audio id="audio03" src="music/Cavalier - Vol. 8 - 03 Blood (feat. Fifty Grand).mp3"></audio>
    <audio id="audio04" src="music/Cavalier - Vol. 8 - 04 Undefined.mp3"></audio>
    <audio id="audio05" src="music/Cavalier - Vol. 8 - 05 Lay.mp3"></audio>
    <audio id="audio06" src="music/Cavalier - Vol. 8 - 06 Kitty Kat.mp3"></audio>
    <audio id="audio07" src="music/Cavalier - Vol. 8 - 07 Too Late.mp3"></audio>
    <audio id="audio08" src="music/Cavalier - Vol. 8 - 08 Midnight (Cavalier Version).mp3"></audio>
    <audio id="audio09" src="music/Cavalier - Vol. 8 - 09 Commas.mp3"></audio>
    <audio id="audio10" src="music/Cavalier - Vol. 8 - 10 Gone.mp3"></audio>
    <audio id="audio11" src="music/Cavalier - Vol. 8 - 11 Love U.mp3"></audio>
    <audio id="bombSFX" src="music/BOMB_SIREN-BOMB_SIREN-247265934.wav"></audio>
    <audio id="fx11" src="music/Fx 11.wav"></audio>
    <audio id="fx14" src="music/Fx 14.wav"></audio>
    <audio id="danger" src="music/72.wav"></audio>
    <audio id="menusound2" src="music/Menu Sounds_2.wav"></audio>
    <audio id="fx_powerUp" src="music/powerUp.wav"></audio>
    <audio id="fx_pickupCoin" src="music/pickupCoin.wav"></audio>
    <audio id="fx_click" src="music/click.wav"></audio>
<script>

// initialize audio
const all_songs = ["01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11"].map(function (n) {
    return document.getElementById("audio" + n);
});

function sfx(id, volume) { // look up a sound effect, optionally setting its volume
    var sound = document.getElementById(id);
    if (volume !== undefined) {
        sound.volume = volume;
    }
    return sound;
}
const aud_bomb = sfx("bombSFX", 0.3);
const aud_menuSound = sfx("menusound2", 0.2);
const aud_death = sfx("fx14", 0.15);
const aud_danger = sfx("danger", 0.05);
const aud_powerUp = sfx("fx_powerUp", 0.1);
const aud_pickupCoin = sfx("fx_pickupCoin", 0.1);
const aud_click = sfx("fx_click", 0.1);
const aud_startup = sfx("fx11");
var musicVolume = 0.2;


// Screens (start, level transitions, finish, pause) are laid out for a LAYOUT_W x LAYOUT_H window and scaled to fit
// the actual window, centered, so they never run off screen. Gameplay stays in window pixels.
var LAYOUT_W = 1280;
var LAYOUT_H = 800;

// start-screen buttons, relative to the center of the layout; used for drawing, hover and clicks
const START_BUTTONS = {
    start: { dx: -410, dy: -32, w: 220, h: 44, hitH: 46 }, // clickable area is 2px taller than the drawn box
    break: { dx: 0, dy: 0, w: 272, h: 40, label: "Space to Break", ty: 38,
        help: "SPACEBAR or MIDDLE MOUSE BUTTON = BREAK - Become invincible briefly.  Lose score, emergency use only!" },
    focus: { dx: 0, dy: 60, w: 272, h: 40, label: "Shift to Focus", ty: 100,
        help: "SHIFT or LEFT MOUSE BUTTON = FOCUS - Slows time and decrease hitbox size.  Earn no score, use in a tight spot." },
    warp: { dx: 0, dy: 120, w: 272, h: 40, label: "Click to warp", ty: 160,
        help: "CTRL or RIGHT MOUSE BUTTON: WARP - Speeds up time.  Earn double score, you madman." },
};
var hoveredButton = ""; // start-screen button under the mouse

// start screen animation, stopped when the game starts (same-delay timers run in creation order)
const startScreenIntervals = [
    setInterval(updateSloganText, 3000),
    setInterval(focus_break_colors, 100),
    setInterval(click_to_start_colors, 50),
    setInterval(highlightControl, 100),
];

// obstacles by lane (the lane sets how fast they move) and powerups; clearObjects replaces the lists
const OBSTACLE_SPEEDS = { slow: 1, medium: 2, fast: 4, hyper: 5 }; // pixels per frame at normal speed
var obstacles, powerups;
function clearObjects() {
    obstacles = { slow: [], medium: [], fast: [], hyper: [] };
    powerups = { break: [], score: [] };
}
clearObjects();
function obstacleLists() { // every obstacle list, slowest lane first
    return [obstacles.slow, obstacles.medium, obstacles.fast, obstacles.hyper];
}

// game play variables
var x = window.innerWidth;
var y = window.innerHeight;
var startTime; // when the run started (ms); moved forward by time spent paused
var pauseStart;
var pausedSong = null; // song to resume when unpausing
var restFrame = null; // uncropped copy of the between-levels screen, for redrawing after resizes
var gamePiece;
var gamePieceColor = "blue";
var sloganText = "";
var sloganY = 120;
var sloganX = 100;

var invincible = false;
var gameStart = false;
var alive = false;
var focused = false;
var pause = false;

var score = 0;
var scoreLimit = 1000;
var powerupScoreBonus = 50;
var scorePenalty = 250; // point deduction for break
var deaths = 0;
var invincibleTime = 0;
var invincibleTimeMax = 200;
var perfectClear = 0;
var scoreLimitReached = false; // level cleared, even if score later drops below the limit
var runFinished = false; // level 15 cleared; the finish screen is showing
var restartArmed = false; // a click began on the finish screen
var finishTime = 0; // when the finish screen appeared
var level = 1;
var speed = 1;
var speed_slow = 0.25;
var speed_fast = 2;


function loadAudio() { // on the first click: start the album, each track playing the next, looping back to the first
    setMusicVolume(musicVolume);
    all_songs.forEach(function (song, i) {
        song.onended = function () { playSound(all_songs[(i + 1) % all_songs.length]); };
    });
    playSound(all_songs[0]);
}

function playSound(audio) { // play, ignoring failures such as blocked autoplay or a missing file
    var playing = audio.play();
    if (playing) { // older browsers (Chrome < 50, Firefox < 53) return nothing
        playing.catch(function () {});
    }
}

function setMusicRate(rate) { // playback rate for all songs
    all_songs.forEach(function (song) { song.playbackRate = rate; });
}

function setMusicVolume(volume) { // volume for all songs
    all_songs.forEach(function (song) { song.volume = volume; });
}

function layoutFrame() { // scale and offset that fit the LAYOUT_W x LAYOUT_H layout into the window, centered
    var scale = Math.min(gameArea.canvas.width / LAYOUT_W, gameArea.canvas.height / LAYOUT_H);
    return { scale: scale, x: (gameArea.canvas.width - LAYOUT_W * scale) / 2, y: (gameArea.canvas.height - LAYOUT_H * scale) / 2 };
}

function useLayout() { // draw in layout coordinates until useWindow()
    var f = layoutFrame();
    ctx.setTransform(f.scale, 0, 0, f.scale, f.x, f.y);
}

function useWindow() { // draw in window pixels (gameplay, banners)
    ctx.setTransform(1, 0, 0, 1, 0, 0);
}

function hudScale() { // the in-game HUD keeps its size unless the window is too short or narrow for it
    // between the top banner (ends at 70px) and the level name (baseline 60px from the bottom) it needs 240px of
    // stats plus 30px of level name, and 600px across for the FOCUS/BREAK/DANGER text
    return Math.max(0.1, Math.min(1, (gameArea.canvas.height - 130) / 270, gameArea.canvas.width / 600));
}

function useHud() { // draw the top-left HUD, shrunk toward the top banner if needed
    var s = hudScale();
    ctx.setTransform(s, 0, 0, s, 0, 70 * (1 - s));
}

function buttonAt(px, py) { // name of the start-screen button at a window point, or ""
    var f = layoutFrame();
    if (!(f.scale > 0)) {
        return "";
    }
    var lx = (px - f.x) / f.scale; // the point in layout coordinates
    var ly = (py - f.y) / f.scale;
    for (var name in START_BUTTONS) {
        var b = START_BUTTONS[name];
        var left = LAYOUT_W / 2 + b.dx;
        var top = LAYOUT_H / 2 + b.dy;
        if (lx > left && lx < left + b.w && ly > top && ly < top + (b.hitH || b.h)) {
            return name;
        }
    }
    return "";
}

function mouseMove(event) { // highlight the start-screen button under the mouse
    if (!gameStart) {
        var hovered = buttonAt(event.clientX, event.clientY);
        if (hovered != hoveredButton) { // only one button highlighted at a time
            drawStartScreen(); // erase the old highlight
            hoveredButton = hovered;
        }
    }
}

function drawTitle(shadowColor, passes) { // FOCUS BREAK title: stacked shadow copies, then magenta on top
    ctx.font = "80px Arial";
    ctx.fillStyle = shadowColor;
    for (let count = 130 - passes; count < 130; count++){ // Bold effect
        ctx.fillText("FOCUS BREAK", count, count+80);
        ctx.fillText("焦点を絞る", count+100, count+180);
    }
    ctx.fillStyle = "#ff00ff";
    ctx.fillText("FOCUS BREAK", 130, 210);
    ctx.fillText("焦点を絞る", 230, 310);
}

function focus_break_colors(){ // Flashing colors on start screen
    useLayout();
    drawTitle(getRandomColor(), 3);
    useWindow();
}

function click_to_start_colors(){ // Flashing colors on start screen
    if (hoveredButton == "start") {
        var b = START_BUTTONS.start;
        ctx.globalAlpha = 0.35;
        ctx.fillStyle = getRandomColorGold();
        var i_x = getRandomInteger(-1, 1);
        var i_y = getRandomInteger(-1, 1);
        useLayout();
        ctx.fillRect(LAYOUT_W / 2 + b.dx + i_x, LAYOUT_H / 2 + b.dy + i_y, b.w + i_x, b.h + i_y);
        ctx.font = "25px Arial";
        ctx.globalAlpha = 1.0;
        ctx.fillStyle = "black";
        ctx.fillText("CLICK TO START", LAYOUT_W / 2 - 400, LAYOUT_H / 2);
        useWindow();
    }
}

function highlightControl() { // Flashing colors on the hovered control button (start screen)
    var b = START_BUTTONS[hoveredButton];
    if (!b || !b.help) {
        return;
    }
    useLayout();
    ctx.fillStyle = "#000000";
    ctx.fillRect(LAYOUT_W / 2 + b.dx, LAYOUT_H / 2 + b.dy, b.w, b.h);
    ctx.font = "40px Impact";
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = getRandomColor();
    ctx.fillText(b.label, LAYOUT_W / 2 + b.dx, LAYOUT_H / 2 + b.ty);
    ctx.globalAlpha = 1.0;
    useWindow();
}

function onLoad() {
    gameArea.load();
    updateSloganText();
    playSound(aud_startup); // startup sound; browsers usually block it until the first click
}

const SLOGANS = ["TOO HARD", "Now in Color!", "Vegan!", "Siezure inducing!", "Advanced!", "Fresh!", "Spicy!", "Gotta Go Fast!",
    "Classic", "Coming Soon!", "4K 1080p", "Lite", "今は日本語です！", "Version 2", "Bug Free!", "Not Lame!", "...", "ULTRA", ""];

function updateSloganText() { // pick a random slogan and redraw the start screen
    sloganText = SLOGANS[Math.floor(Math.random() * SLOGANS.length)];
    drawStartScreen();
}

function copyCanvas() { // copy of what's on screen, or null if the canvas has no size
    if (gameArea.canvas.width == 0 || gameArea.canvas.height == 0) {
        return null;
    }
    var copy = document.createElement("canvas");
    copy.width = gameArea.canvas.width;
    copy.height = gameArea.canvas.height;
    copy.getContext("2d").drawImage(gameArea.canvas, 0, 0);
    return copy;
}

function windowResize() {
    x = window.innerWidth;
    y = window.innerHeight;
    // resizing clears the canvas; keep what's shown between levels, e.g. a level transition message.
    // copy it once, before the first resize crops it, and reuse that copy for later resizes
    if (gameStart && !alive && !restFrame) {
        restFrame = copyCanvas();
    }
    gameArea.load();
    if (alive) {
        fitObstaclesToWindow();
        if (pause) { // nothing redraws while paused, so draw the refitted level and the panel once
            drawLevel();
            drawPauseScreen();
        }
    } else if (restFrame) {
        gameArea.context.drawImage(restFrame, 0, 0);
    }
    if (!gameStart) {
        drawStartScreen();
    }
}

function drawStartScreen() { // draw the start screen
    var cx = LAYOUT_W / 2;
    var cy = LAYOUT_H / 2;

    // clear screen
    useWindow();
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, x, y);

    // Title
    useLayout();
    drawTitle("#00FFFF", 10);

    // start button
    ctx.font = "25px Arial";
    ctx.globalAlpha = 0.2;
    ctx.fillStyle = "gray";
    var start = START_BUTTONS.start;
    ctx.fillRect(cx + start.dx, cy + start.dy, start.w, start.h);
    ctx.globalAlpha = 1.0;
    ctx.fillStyle = "black";
    ctx.fillText("CLICK TO START", cx - 400, cy);
    ctx.fillRect(cx - 450, cy + 25, 300, 2);
    ctx.fillText("クリックして開始", cx - 400, cy + 65);

    // controls: all boxes, then all labels
    var controls = [START_BUTTONS.break, START_BUTTONS.focus, START_BUTTONS.warp];
    ctx.fillStyle = "#00FFFF";
    controls.forEach(function (b) { ctx.fillRect(cx + b.dx, cy + b.dy, b.w, b.h); });
    ctx.font = "40px Impact";
    ctx.fillStyle = "#ff00ff";
    ctx.globalAlpha = 0.5;
    controls.forEach(function (b) { ctx.fillText(b.label, cx + b.dx, cy + b.ty); });

    // horizontal banners across the whole window
    useWindow();
    ctx.globalAlpha = 1.0;
    ctx.font = "40px Arial";
    ctx.fillStyle = "#00FFFF";
    var k = bannerScale();
    drawBanners(34, 30, k);
    ctx.fillStyle = "#ff00ff";
    drawBanners(40, 20, k);
    ctx.fillStyle = "black";
    ctx.globalAlpha = 0.7;
    ctx.fillRect(0, y - 40 * k, x, 2);
    ctx.fillRect(0, 60 * k, x, 2);

    // slogan
    useLayout();
    ctx.globalAlpha = 1.0;
    ctx.fillStyle = "#ff00ff";
    ctx.fillText(sloganText,sloganX,sloganY);
    if (sloganText == "Bug Free!"){
        for (let count = 1; count < 40; count++){ // Bold effect
            ctx.fillText("Bug Free!",sloganX-40+count,sloganY-40+count);
            ctx.fillStyle = getRandomColor();
        }
    }

    // Options
    var boxX = 256;
    var boxY = 40;
    var Yoffset = boxX/2;
    ctx.fillRect(cx, (LAYOUT_H - Yoffset), boxX, boxY);
    ctx.fillText("Options", cx, (LAYOUT_H - Yoffset));

    ctx.fillStyle = "black";
    ctx.fillRect((cx + (boxX / 16)), (LAYOUT_H - Yoffset + (boxY / 4)), boxX/3, boxY/2);
    ctx.fillRect((cx + (boxX / 16)*8), (LAYOUT_H - Yoffset + (boxY / 4)), boxX/3, boxY/2);

    ctx.fillStyle = "pink";
    ctx.fillText("Options", (cx + (boxX / 16)), (LAYOUT_H - Yoffset + (boxY / 4))+10);
    useWindow();
}

function startGame(e) {
    if (!gameStart) { // first start
        startScreenIntervals.forEach(function (id) { clearInterval(id); });
        loadAudio();
        playSound(aud_click);
        startTime = Date.now();
        var size = pieceSize();
        gamePiece = new component(size, size, gamePieceColor, e.pageX - size / 2, e.pageY - size / 2); // centered on the cursor
    }
    gameArea.start();
    gameStart = true;
    alive = true;
    restFrame = null; // the next transition screen gets a fresh copy
    pause = false;
    if (!document.hasFocus()) { // player left during the level transition; wait for them
        setPause(true);
    }
    applyHeldSpeed(); // pick up a power held through the level transition (does nothing while paused)
}

function wait(time) {
    setTimeout(startNextLevel, time);
}

function restartRun() { // after the finish screen, start a fresh run from level 1
    runFinished = false;
    restartArmed = false;
    level = 1;
    deaths = 0;
    perfectClear = 0; // the hitbox shrink is earned again each run
    score = 0;
    scoreLimitReached = false;
    startTime = Date.now();
    setPieceSize(pieceSize());
    startNextLevel();
}

function startNextLevel() {
    gameArea.clear();
    startGame();
    setMusicVolume(musicVolume);
}

function gameOver() { // the level was cleared or the player died
    alive = false;
    endBreak(); // a level can end mid-break
    resumeSpeed();
    setMusicVolume(musicVolume);
    gameArea.stop();
    gameArea.clear();
    clearObjects();
    ctx.font = "60px Arial";
    ctx.fillStyle = "red";
    useLayout(); // messages are laid out for LAYOUT_W x LAYOUT_H and scaled to the window
    gameArea.canvas.style.cursor = "default";
    var levelCleared = score >= scoreLimit || scoreLimitReached;
    scoreLimitReached = false;
    if (levelCleared) { // Next level
        level++;
        if (level == 16){ // true finish
            ctx.fillText("Time: " + millisToMinutesAndSeconds(Date.now() - startTime), LAYOUT_W / 2 - 350, LAYOUT_H / 2);
            if (deaths == 0){
                ctx.fillText("Flawless Victory", LAYOUT_W / 2 - 350, LAYOUT_H / 2 - 175);
            } else {
                ctx.fillText("Can you continue?", LAYOUT_W / 2 - 350, LAYOUT_H / 2 - 175);
                ctx.fillText(deaths+" mistakes", LAYOUT_W / 2 - 350, LAYOUT_H / 2 - 87);
            }
            ctx.fillStyle = "black";
            ctx.font = "30px Arial";
            ctx.fillText("Click or press R to play again", LAYOUT_W / 2 - 350, LAYOUT_H / 2 + 87);
            runFinished = true;
            finishTime = Date.now();
            restartArmed = false; // a click already in progress (e.g. held for Focus) shouldn't restart
            useWindow();
            return;
        } else if (level == 10){ // you win
            ctx.fillStyle = "Black";
            ctx.fillText("Victory is a state of mind", LAYOUT_W / 2 - 350, LAYOUT_H / 2 - 175);
            ctx.fillText("勝利は心の状態です", LAYOUT_W / 2 - 275, LAYOUT_H / 2 - 75);
            drawBanners(40, 20, bannerScale());
            wait(5000);
        } else if (level == 9){
            setMusicVolume(0.0);
            playSound(aud_bomb);
            ctx.font = "80px Arial";
            for (let count = 0; count < 3; count++){ // bold effect
                ctx.fillText("WARNING 警告", (LAYOUT_W / 2 - 300)+count, (LAYOUT_H / 2 - 175)+count);
                ctx.fillText("多数の敵が接近する", (LAYOUT_W / 2 - 400)+count, (LAYOUT_H / 2 - 75)+count);
            }
            drawBanners(40, 30, bannerScale());
            wait(3500);
        } else if (deaths == 0) { // perfect clear
            playSound(aud_menuSound);
            ctx.fillStyle = "#48D1CC";
            if (perfectClear < 7){ // decrease hitbox size
                perfectClear++;
                ctx.fillText("Hitbox size decreased!", (LAYOUT_W / 2 - 325), (LAYOUT_H / 2 - 75));
                ctx.fillText("ヒットボックスを減らす!", (LAYOUT_W / 2 - 325), (LAYOUT_H / 2 + 50));
            }
            for (let count = 0; count < 3; count++){
                ctx.fillText("+ Perfect 完全 +", (LAYOUT_W / 2 - 200)+count, (LAYOUT_H / 2 - 175)+count);
            }
            drawBanners(40, 20, bannerScale());
            wait(3000);
        } else { // normal clear
            ctx.fillText("Enemies Approaching", LAYOUT_W / 2 - 300, LAYOUT_H / 2 - 175);
            ctx.fillText("非常に大きな敵に接近する危険!", LAYOUT_W / 2 - 425, LAYOUT_H / 2 - 50);
            ctx.fillText("慎重に進んでください!", LAYOUT_W / 2 - 300, LAYOUT_H / 2 + 25);
            wait(3000);
        }
    } else { // you lose
        deaths += 1;
        playSound(aud_death);
        ctx.fillText("Score: " + score, LAYOUT_W / 2 - 200, LAYOUT_H / 2 - 75);
        var deathSlogan = { 69: "😂", 420: "blaze it", 666: "😈", 911: "TOO SOON", 999: "TOO HARD" }[score]; // special scores
        if (deathSlogan) {
            ctx.fillText(deathSlogan, LAYOUT_W / 2 -150, LAYOUT_H / 2 +25);
        }
        if (score >= 900) {
            ctx.fillText("So Close", LAYOUT_W / 2 - 200, LAYOUT_H / 2 - 175);
        } else if (score <= 100) {
            ctx.fillText("...", LAYOUT_W / 2 - 100, LAYOUT_H / 2 - 175);
        } else {
            ctx.fillText("Try Again", LAYOUT_W / 2 - 200, LAYOUT_H / 2 - 175);
            ctx.fillText("再試行する", LAYOUT_W / 2 - 200, LAYOUT_H / 2 +25);
        }
        wait(2500);
    }
    useWindow();
    score = 0;
}

function resizeAroundCenter(obj, size) { // make obj a size x size square with the same center
    obj.x -= (size - obj.width) / 2;
    obj.y -= (size - obj.height) / 2;
    obj.width = size;
    obj.height = size;
}

function setPieceSize(size) { // gamePiece's center sits on the cursor
    resizeAroundCenter(gamePiece, size);
}

function pieceSize() { // hitbox size: smaller during Focus or Warp, and 1px smaller for each flawless level
    return (focused ? 15 : 20) - perfectClear;
}

function setMode(isFocused, newSpeed, musicRate) { // normal speed, Focus or Warp
    focused = isFocused;
    if (alive) {
        setPieceSize(pieceSize());
    }
    speed = newSpeed;
    setMusicRate(musicRate);
}

function resumeSpeed() { setMode(false, 1, 1.0); }
function setSlowSpeed() { setMode(true, speed_slow, 0.75); } // FOCUS
function setFastSpeed() { setMode(true, speed_fast, 1.2); } // WARP

function setBreak(penalty){
    if (!invincible) {
        powerups.break = []; // destroy powerups on break
        powerups.score = [];
        invincible = true;
        score += -penalty;
    }
}

// power inputs currently held down, so releasing one can fall back to another
var held = { shift: false, ctrl: false, lmb: false, rmb: false };

function canAct() { // powers only work while playing and unpaused
    return alive && !pause;
}

function setPause(paused) { // pause or resume play; only while alive
    if (!alive || paused == pause) {
        return;
    }
    pause = paused;
    gameArea.canvas.style.cursor = pause ? "default" : "none"; // let the player line the cursor back up with their square
    if (pause) {
        pauseStart = Date.now();
        pausedSong = all_songs.find(function (song) { return !song.paused; }) || null;
        if (pausedSong) {
            pausedSong.pause();
        }
        aud_danger.pause();
        [aud_bomb, aud_death, aud_menuSound].forEach(function (sound) { // cut transition sounds short; rewind so they replay from the start
            sound.pause();
            sound.currentTime = 0;
        });
        drawPauseScreen();
    } else { // exclude paused time from the completion timer
        startTime += Date.now() - pauseStart;
        if (pausedSong) {
            playSound(pausedSong);
            pausedSong = null;
        }
        applyHeldSpeed(); // pick up anything pressed or released while paused
    }
}

function drawPauseScreen() { // drawn once over the frozen frame
    useLayout();
    var centerX = LAYOUT_W / 2;
    var centerY = LAYOUT_H / 2;
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = "white";
    ctx.fillRect(centerX - 220, centerY - 70, 440, 160);
    ctx.globalAlpha = 1.0;
    ctx.textAlign = "center";
    ctx.fillStyle = "red";
    ctx.font = "60px Arial";
    ctx.fillText("PAUSED", centerX, centerY);
    ctx.fillStyle = "black";
    ctx.font = "25px Arial";
    ctx.fillText("Press P to resume", centerX, centerY + 40);
    ctx.font = "18px Arial";
    ctx.fillText("Move the cursor onto your square first", centerX, centerY + 72);
    ctx.textAlign = "start"; // the rest of the game draws left-aligned text
    useWindow();
}

function applyHeldSpeed() { // set speed from whatever power is still held
    if (!canAct()) {
        return;
    }
    if (held.shift || held.lmb) {
        setSlowSpeed();
    } else if (held.ctrl || held.rmb) {
        setFastSpeed();
    } else {
        resumeSpeed();
    }
}

function pressPower(input, activate) { // a power key or button went down: remember it, and use it now if playing
    held[input] = true;
    if (canAct()) {
        activate();
    }
}

function keyName(e) { // the game key pressed: "p", "r", " " (space), "Shift", "Control", or something else
    var key = e.key === "Spacebar" ? " " : e.key; // old Edge/IE called space "Spacebar"
    if (key && key.length == 1 && /[a-z ]/i.test(key)) {
        return key.toLowerCase(); // letters as typed, so Shift+P or Caps Lock still works
    }
    if (key == "Shift" || key == "Control") {
        return key;
    }
    // anything else: an older browser without e.key, a non-Latin keyboard layout (including letters outside the
    // basic character range, like ADLaM), a layout-switch key such as "GroupNext", or a tool that leaves key empty
    return { 16: "Shift", 17: "Control", 32: " ", 80: "p", 82: "r" }[e.keyCode] || key;
}

function tryBreak() { // Space or middle click
    if (canAct()) {
        setBreak(scorePenalty);
    }
}

function endBreak() { // back to normal after a Break
    invincible = false;
    invincibleTime = 0;
    gamePiece.color = gamePieceColor;
}

var gameArea = {
    canvas: document.createElement("canvas"),
    load: function () {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
        if (this.inputBound) {
            return; // load() re-runs on resize; only insert the canvas and register input listeners once
        }
        this.inputBound = true;
        document.body.insertBefore(this.canvas, document.body.childNodes[0]);
        window.addEventListener('click', function (e) {
            var button = gameStart ? "" : buttonAt(e.clientX, e.clientY);
            if (button == "start") {
                startGame(e);
            } else if (button) { // a control button: explain it
                alert(START_BUTTONS[button].help);
            } else if (runFinished && restartArmed) { // play again from the finish screen
                restartRun();
            }
        });
        window.addEventListener('mousedown', function (e) {
            e.preventDefault();
            window.focus(); // preventDefault stops the page taking focus when embedded in an iframe
            if (e.button == 0 && runFinished && Date.now() - finishTime >= 1000) {
                // only a click that starts on the finish screen restarts, and not in the first second,
                // so a Focus tap as level 15 ends doesn't wipe the results before they're seen
                restartArmed = true;
            }
            if (e.button == 0) { // left mouse button = FOCUS
                pressPower("lmb", setSlowSpeed);
            }
            if (e.button == 2) { // right mouse button = WARP
                pressPower("rmb", setFastSpeed);
            }
            if (e.button == 1) { // middle mouse button = BREAK
                tryBreak();
            }
        });
        window.addEventListener('mouseup', function (e) {
            e.preventDefault();
            var released = { 0: "lmb", 2: "rmb" }[e.button];
            if (released) {
                held[released] = false;
            }
            applyHeldSpeed(); // fall back to any power still held (this also ends level 15's forced Warp)
        });
        window.addEventListener('mousemove', function (e) {
            mouseMove(e); // start-screen hover
            // catch buttons or keys released outside the window
            var lmb = (e.buttons & 1) != 0;
            var rmb = (e.buttons & 2) != 0;
            if (held.lmb != lmb || held.rmb != rmb || held.shift != e.shiftKey || held.ctrl != e.ctrlKey) {
                held.lmb = lmb;
                held.rmb = rmb;
                held.shift = e.shiftKey;
                held.ctrl = e.ctrlKey;
                applyHeldSpeed();
            }
            if (gameStart) { // the square follows the cursor (movePiece moves it there each frame)
                gameArea.x = e.pageX;
                gameArea.y = e.pageY;
                setPieceSize(pieceSize());
            }
        });
        window.addEventListener('blur', function () { // releases aren't seen while the window is unfocused
            held.shift = held.ctrl = held.lmb = held.rmb = false;
            applyHeldSpeed();
            setPause(true); // don't keep playing while the player is away
        });
        window.addEventListener('keydown', function (e) {
            var key = keyName(e);
            if (alive && e.ctrlKey) {
                e.preventDefault(); // block browser shortcuts while holding CTRL to warp
            }
            if (key == "r" && runFinished && !e.repeat && !e.ctrlKey && !e.metaKey) { // R = play again (Ctrl+R still reloads)
                restartRun();
            }
            if (key == "p") { // P
                e.preventDefault();
                if (!e.repeat) { // holding P shouldn't flip pause on every key repeat
                    setPause(!pause);
                }
            }
            if (key == " ") { // SPACEBAR = BREAK
                e.preventDefault();
                tryBreak();
            }
            if (key == "Shift") { // SHIFT = FOCUS
                e.preventDefault();
                pressPower("shift", setSlowSpeed);
            }
            if (key == "Control") { // CTRL = WARP
                e.preventDefault();
                pressPower("ctrl", setFastSpeed);
            }
        });
        window.addEventListener('keyup', function (e) {
            var released = { Shift: "shift", Control: "ctrl" }[keyName(e)];
            if (released) {
                held[released] = false;
                applyHeldSpeed(); // fall back to any power still held
            }
        });
    },
    start: function () {
        this.canvas.style.cursor = "none"; // hide the original cursor
        this.frameNo = 0;
        this.spawnClock = 0; // game time for spawning, advanced by the game speed each step
        this.stop(); // never run two loops
        this.running = true;
        this.lastTime = performance.now();
        this.pendingTime = 0;
        this.frameRequest = requestAnimationFrame(runSteps);
    },
    clear: function () {
        this.context.clearRect(0, 0, this.canvas.width, this.canvas.height);
    },
    stop: function () {
        this.running = false;
        cancelAnimationFrame(this.frameRequest);
    }
};

// The game advances in fixed 10ms steps, 100 a second (the speed it was tuned for): every display frame runs
// as many steps as real time has covered, so a slow or busy machine doesn't slow the game down.
var STEP_MS = 10;
var MAX_CATCH_UP_MS = 100; // after a longer stall, resume instead of fast-forwarding through it

function runSteps(now) {
    if (!gameArea.running) {
        return;
    }
    gameArea.pendingTime += Math.min(Math.max(now - gameArea.lastTime, 0), MAX_CATCH_UP_MS);
    gameArea.lastTime = now;
    while (gameArea.running && gameArea.pendingTime >= STEP_MS) { // a step can end the level, which stops the loop
        gameArea.pendingTime -= STEP_MS;
        updateGameArea();
    }
    if (gameArea.running) {
        gameArea.frameRequest = requestAnimationFrame(runSteps);
    }
}
var ctx = gameArea.context = gameArea.canvas.getContext("2d"); // the one drawing context (resizing resets its state, not the object)

function component(width, height, color, x, y) {
    this.width = width;
    this.height = height;
    this.color = color;
    this.x = x;
    this.y = y;
    this.update = function () {
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, this.width, this.height);
    };

    this.crashWith = function (otherobj) {
        if (otherobj.width <= 0 || otherobj.height <= 0) {
            return false; // nothing drawn (e.g. a bar squeezed off screen by a resize), so nothing to hit
        }
        return !(this.y + this.height < otherobj.y || this.y > otherobj.y + otherobj.height ||
                 this.x + this.width < otherobj.x || this.x > otherobj.x + otherobj.width); // touching edges count as a hit
    };
}

function detectCollision(objects) { // is gamePiece touching anything in this list
    return objects.some(function (obj) { return gamePiece.crashWith(obj); });
}

function collectPowerUps() { // apply any powerup gamePiece is touching
    if (detectCollision(powerups.break)) {
        playSound(aud_powerUp);
        powerups.break = [];
        if (invincible) {
            invincibleTime = 0; // refill an active break instead of wasting the powerup
        } else {
            setBreak(0);
        }
    }
    if (detectCollision(powerups.score)) {
        playSound(aud_pickupCoin);
        powerups.score = [];
        score += powerupScoreBonus;
    }
}

function hitObstacle() { // is gamePiece touching any obstacle
    return obstacleLists().some(detectCollision);
}

function movePiece(targetX, targetY) { // move gamePiece to the cursor, returns true on a crash
    // step at most 5px at a time so fast mouse moves (or moving while paused) can't jump over obstacles
    var startX = gamePiece.x;
    var startY = gamePiece.y;
    var dx = targetX - startX;
    var dy = targetY - startY;
    var steps = invincible ? 1 : Math.max(1, Math.ceil(Math.max(Math.abs(dx), Math.abs(dy)) / 5));
    for (let s = 1; s <= steps; s += 1) {
        gamePiece.x = startX + dx * s / steps;
        gamePiece.y = startY + dy * s / steps;
        collectPowerUps(); // pick up powerups along the way too
        if (!invincible && hitObstacle()) {
            return true;
        }
    }
    return false;
}

function heightScaledBlock(fraction, color) { // square sized as a fraction of the screen height, spawned at the right edge
    var size = gameArea.canvas.height * fraction;
    var block = new component(size, size, color, gameArea.canvas.width, Math.random() * gameArea.canvas.height);
    block.heightFraction = fraction; // lets fitObstaclesToWindow keep its proportion after a resize
    return block;
}

function fitObstaclesToWindow() { // after a resize, refit obstacles whose size depends on the screen height
    var canvasHeight = gameArea.canvas.height;
    obstacleLists().forEach(function (objects) {
        objects.forEach(function (obj) {
            var before = { x: obj.x, y: obj.y, width: obj.width, height: obj.height };
            if (obj.barGap) {
                // keep the gap where it is (the square may be in it), moving it up only if the
                // window got too short to show it, so a bar pair never becomes a solid wall
                var gapTop = obj.barGap.top ? obj.height : obj.y - obj.barGap.size;
                gapTop = Math.max(0, Math.min(gapTop, canvasHeight - obj.barGap.size));
                if (obj.barGap.top) {
                    obj.height = gapTop;
                } else { // the bottom bar always reaches the bottom edge
                    obj.y = gapTop + obj.barGap.size;
                    obj.height = Math.max(0, canvasHeight - obj.y);
                }
            }
            if (obj.heightFraction) {
                resizeAroundCenter(obj, canvasHeight * obj.heightFraction);
            }
            if (gamePiece.crashWith(obj) && !gamePiece.crashWith(before)) {
                Object.assign(obj, before); // growing onto the square would be an unavoidable death; keep the old size
            }
        });
    });
}

function moveObjects(objects, amount, recolor) { // move left, drop what's off screen, draw the rest (optionally recolored)
    for (let i = objects.length - 1; i >= 0; i -= 1) {
        objects[i].x += -amount * speed; // speed of obstacles
        if (objects[i].x + objects[i].width < 0) { // remove once off screen
            objects.splice(i, 1);
            continue;
        }
        if (recolor) {
            objects[i].color = recolor;
        }
        objects[i].update();
    }
}

function spawnDue(every) { // true on a level's first frame, then once per 2 * every frames of normal-speed time
    // spawnClock runs at the game speed, so Focus/Warp stretch or shrink the gap in frames but not in distance;
    // switching speed no longer bunches up or spreads out the spawns
    var period = every * 2;
    return gameArea.frameNo == 1 || Math.floor(gameArea.spawnClock / period) > Math.floor(gameArea.lastSpawnClock / period);
}

function edgeBlock(w, h, color, xOffset) { // block entering at the right edge (plus xOffset) at a random height
    return new component(w, h, color, gameArea.canvas.width + (xOffset || 0), Math.random() * window.innerHeight);
}

function spawnBarPair() { // a vertical black bar pair with a gap to pass through
    var minHeight = 20;
    var maxHeight = window.innerHeight - 60;
    var height = Math.floor(Math.random() * (maxHeight - minHeight + 1) + minHeight);
    var minGap = 85 - (level * 2);
    var maxGap = 125 - (level * 2);
    var gap = Math.floor(Math.random() * (maxGap - minGap + 1) + minGap);
    var barX = gameArea.canvas.width;
    var topBar = new component(20, height, "black", barX, 0);
    var bottomBar = new component(20, gameArea.canvas.height - height - gap, "black", barX, height + gap);
    // remember where the gap sits so fitObstaclesToWindow can keep it passable after a resize
    topBar.barGap = { size: gap, top: true };
    bottomBar.barGap = { size: gap, top: false };
    obstacles.medium.push(topBar);
    obstacles.medium.push(bottomBar);
}

function blackBlock() { return edgeBlock(25, 25, "black"); }
function redBlock() { return edgeBlock(25, 25, "red"); }
function scatteredBlackBlock() { return edgeBlock(25, 25, "black", getRandomInteger(0, 250)); } // up to 250px further right so they don't line up
function blackOblong() { return edgeBlock(10, 50, "black"); }

// what each level spawns, checked in this order every frame (the order also decides which blocks draw on top).
// A rule applies from level `from` on, up to `to` if given; `every` is its spawnDue period; `lane` is the list it joins.
const SPAWN_RULES = [
    { from: 1, every: 50, make: spawnBarPair }, // adds itself to the medium lane
    { from: 2, every: 100, lane: "hyper", make: function () { return heightScaledBlock(1 / 8, "black"); } },
    { from: 3, every: 20, lane: "fast", make: blackBlock },
    { from: 4, every: 20, lane: "medium", make: function () { return edgeBlock(10, 10, "red"); } },
    { from: 5, every: 20, lane: "fast", make: scatteredBlackBlock }, // levels 5-8 each add one more
    { from: 6, every: 20, lane: "fast", make: scatteredBlackBlock },
    { from: 7, every: 20, lane: "fast", make: scatteredBlackBlock },
    { from: 8, every: 20, lane: "fast", make: scatteredBlackBlock },
    { from: 9, every: 8, lane: "fast", make: redBlock },
    { from: 10, to: 10, every: 8, lane: "fast", make: redBlock },
    { from: 10, to: 10, every: 200, lane: "slow", make: function () { return heightScaledBlock(1 / 4, "red"); } },
    { from: 11, every: 200, lane: "medium", make: blackOblong },
    { from: 12, every: 20, lane: "medium", make: blackOblong },
    { from: 13, every: 20, lane: "fast", make: redBlock },
    { from: 14, every: 150, lane: "slow", make: function () { return heightScaledBlock(1 / 8, "red"); } },
    { from: 14, every: 20, lane: "fast", make: blackBlock },
    { from: 15, every: 20, lane: "fast", make: redBlock },
    { from: 15, every: 20, lane: "fast", make: blackBlock },
];

// level names; levels 6 and 10 have [name while no deaths yet, name after a death]; levels past 14 use the fallback
const LEVEL_NAMES = [null, "Breath Easy", "Clear Your Mind", "Looking Inward", "Flow", "Reaching",
    ["Seeking Perfection", "Past mistakes"], "Looking Outward", "Memory Advance", "Self Destruct",
    ["Perfection", "Remains"], "Afterlife", "Desolation", "Rebirth", "..."];

function drawLevelName() { // level name in the bottom-left corner (level 13 also draws a red bar, level 14 two black bars)
    ctx.fillStyle = "black";
    ctx.font = "40px Arial";
    var w = gameArea.canvas.width / 1920; // the bars were placed for a 1920px-wide (fullscreen) window; keep their relative spot
    if (level == 13) {
        ctx.fillStyle = "red";
        ctx.fillRect(900 * w, 0, 100 * w, window.innerHeight);
        ctx.fillStyle = "black";
    } else if (level == 14) {
        ctx.fillRect(900 * w, 0, 100 * w, window.innerHeight);
        ctx.fillRect(1100 * w, 0, 2000 * w, window.innerHeight);
    }
    var name = LEVEL_NAMES[level];
    if (Array.isArray(name)) {
        name = deaths == 0 ? name[0] : name[1];
    }
    var s = hudScale(); // shrunk with the HUD, baseline kept just above the bottom banner
    ctx.setTransform(s, 0, 0, s, 0, window.innerHeight - 60);
    ctx.fillText(name || "How did this happen?", 80, 0);
    useWindow();
}

function drawStats(color, scoreColor) { // deaths, level and score in the top-left corner; the score can have its own color
    ctx.font = "40px Arial";
    ctx.fillStyle = color;
    ctx.fillText(deaths, 50, 200); // show deaths
    ctx.fillText("Level " + level, 50, 300); // show level
    ctx.fillStyle = scoreColor || color;
    ctx.fillText(score, 50, 100); // show score
}

function drawBanners(top, thickness, scale) { // matching stripes across the top and bottom of the window, in the current fill style
    var k = scale || 1; // screens pass bannerScale() so the stripes shrink along with their text
    ctx.save();
    useWindow(); // always the full window width, whatever layout is being drawn
    ctx.fillRect(0, top * k, window.innerWidth, thickness * k);
    ctx.fillRect(0, window.innerHeight - (100 - top) * k, window.innerWidth, thickness * k);
    ctx.restore();
}

function bannerScale() { // stripe size on laid-out screens: normal, or smaller when the layout is scaled down
    return Math.min(1, layoutFrame().scale);
}

function drawLevel() { // draw the level as it stands, without moving anything (used while paused)
    gameArea.clear();
    drawLevelName();
    [powerups.break, powerups.score].concat(obstacleLists()).forEach(function (objects) {
        objects.forEach(function (obj) {
            obj.update();
        });
    });
    gamePiece.update();
    useHud();
    drawStats("black");
    useWindow();
}

function updateGameArea() {
    if (!pause){
        if (!invincible && hitObstacle()) { // detect collisions
            gameOver();
            return;
        }

        collectPowerUps();

        gameArea.clear();
        gameArea.frameNo += 1;
        gameArea.lastSpawnClock = gameArea.spawnClock;
        gameArea.spawnClock += speed;

        if (invincible) {
            ctx.fillRect((gamePiece.x + gamePiece.width / 2 - 50 + invincibleTime / 2), (gamePiece.y + gamePiece.height / 2 - 25),(invincibleTimeMax - invincibleTime), (15)); // display invincible progress
            invincibleTime += focused ? 2 : 1;
            gamePiece.color = getRandomColor();
            if (invincibleTime >= invincibleTimeMax) {
                endBreak();
            }
        }

        drawLevelName();
        // Object Spawning
        if (everyinterval(250) && !focused) { // powerup, even odds of each kind
            if (Math.random() >= 0.5) {
                powerups.break.push(edgeBlock(15, 15, getRandomColor()));
            } else {
                powerups.score.push(edgeBlock(20, 20, getRandomColorGold()));
            }
        }
        SPAWN_RULES.forEach(function (rule) {
            if (level >= rule.from && (rule.to === undefined || level <= rule.to) && spawnDue(rule.every)) {
                var obj = rule.make();
                if (rule.lane) {
                    obstacles[rule.lane].push(obj);
                }
            }
        });
        if (level >= 15 && spawnDue(20)) { // level 15 keeps forcing Warp
            setFastSpeed();
        }

        moveObjects(powerups.break, 3, getRandomColor());
        moveObjects(powerups.score, 3, getRandomColorGold());
        for (var lane in OBSTACLE_SPEEDS) {
            moveObjects(obstacles[lane], OBSTACLE_SPEEDS[lane]);
        }

        if (gameArea.x !== undefined && movePiece(gameArea.x - gamePiece.width / 2, gameArea.y - gamePiece.height / 2)) { // center the hitbox on the cursor
            gameOver();
            return;
        }
        useHud(); // score, deaths, level and the power messages
        if (invincible) { // BREAK
            var flash = getRandomColor();
            ctx.fillStyle = flash;
            ctx.globalAlpha = 0.75;
            ctx.font = "60px Arial";
            ctx.fillText("BREAK! 壊れる", 200, 200);
            drawBanners(40, 20);
            ctx.globalAlpha = 0.8;
            drawStats(flash, "red");
            ctx.globalAlpha = 1.0;
        } else {
            drawStats("black");
        }
        if (speed == 1) {
            if (gameArea.frameNo % 2 == 0){
                score++;
            }
        } else if (speed == speed_slow) { // FOCUS
            ctx.globalAlpha = 0.75;
            drawBanners(40, 30);
            ctx.fillStyle = "red";
            ctx.font = "60px Arial";
            ctx.fillText("FOCUS! 焦点", 200, 200);
            ctx.font = "40px Arial";
            ctx.fillText(score, 50, 100);
            ctx.globalAlpha = 1.0;
        } else if (speed == speed_fast){
            playSound(aud_danger);
            ctx.fillStyle = "red";
            ctx.globalAlpha = 0.8;
            drawBanners(40, 30);
            ctx.globalAlpha = 1.0;
            ctx.font = "60px Arial";
            if (everyinterval(1)) {
                ctx.fillText("DANGER! 危険", 200, 200);
            }
            ctx.font = "40px Arial";
            ctx.fillStyle = getRandomColor();
            ctx.fillText("+", 120, 100);
            ctx.fillText(score, 50, 100);
            score += 1;
        }
        useWindow();
        gamePiece.update();
        if (score >= scoreLimit) {
            scoreLimitReached = true; // stays set if a break penalty drops the score back below the limit
        }
        if (scoreLimitReached) { // score limit reached
            if (level == 9){ // play until you die
                useHud();
                ctx.fillStyle = getRandomColor();
                ctx.fillText(score, 50, 100);
                useWindow();
            } else {
                gameOver();
            }
        }
    } // while paused, nothing updates; setPause draws the pause screen once
}

function everyinterval(n) {
    if ((((gameArea.frameNo) / (n)) % 2) == 0) { return true; }
    return false;
}

function getRandomColor() {  // generate a random color
    var letters = '0123456789ABCDEF';
    var color = '#';
    for (var i = 0; i < 6; i++) {
        color += letters[Math.floor(Math.random() * 16)];
    }
    return color;
}

function getRandomColorGold() { // random bright color from orange to yellow-green (hue 25-100), as #rrggbb
    var hue = (Math.floor(Math.random() * 76) + 25) / 360;
    var channel = function (t) { // HSL at 100% saturation and 50% lightness: a trapezoid wave around the hue circle
        if (t < 0) t += 1;
        var v = t < 1 / 6 ? 6 * t : t < 1 / 2 ? 1 : t < 2 / 3 ? (2 / 3 - t) * 6 : 0;
        return ("0" + Math.round(v * 255).toString(16)).slice(-2);
    };
    return "#" + channel(hue + 1 / 3) + channel(hue) + channel(hue - 1 / 3);
}

function getRandomInteger(min, max) {
    return Math.floor(Math.random() * (max - min) ) + min;
}

function millisToMinutesAndSeconds(millis) { // ms conversions
    var minutes = Math.floor(millis / 60000);
    var seconds = ((millis % 60000) / 1000).toFixed(0);
    return minutes + ":" + (seconds < 10 ? '0' : '') + seconds;
}

</script>
